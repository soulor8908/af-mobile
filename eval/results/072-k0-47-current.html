<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">限时秒杀</nav>
  <div class="card m-2 f aic jcsb">
    <span class="body">距结束</span>
    <af-countdown id="cd" time="7200" autostart></af-countdown>
  </div>
  <div class="grid-2 g-2 p-2" id="grid"></div>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register('af-countdown');

const cd = document.getElementById('cd');
const formatTime = (sec) => {
  const h = Math.floor(sec / 3600).toString().padStart(2, '0');
  const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${h}:${m}:${s}`;
};
cd.addEventListener('af-countdown:change', (e) => {
  cd.textContent = formatTime(e.detail.remaining);
});
cd.textContent = formatTime(7200);

const products = [
  { id: 1, title: '无线降噪蓝牙耳机 超长续航', price: '199.00', oldPrice: '499.00', tag: '4折', img: 'https://picsum.photos/seed/p1/300/300' },
  { id: 2, title: '智能运动手表 心率监测防水', price: '299.00', oldPrice: '899.00', tag: '3折', img: 'https://picsum.photos/seed/p2/300/300' },
  { id: 3, title: '复古胶片相机 拍立得', price: '599.00', oldPrice: '1299.00', tag: '5折', img: 'https://picsum.photos/seed/p3/300/300' },
  { id: 4, title: '便携式榨汁机 家用料理', price: '99.00', oldPrice: '299.00', tag: '3折', img: 'https://picsum.photos/seed/p4/300/300' },
];

const grid = document.getElementById('grid');
grid.innerHTML = products.map(p => `
  <div class="card-media">
    <img src="${p.img}" class="aspect-1" alt="">
    <div class="p-2 fc g-1">
      <div class="title ellipsis-2">${p.title}</div>
      <div class="f aic jcsb">
        <span class="price">¥${p.price}</span>
        <span class="tag tag-danger">${p.tag}</span>
      </div>
      <div class="price-del">¥${p.oldPrice}</div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
