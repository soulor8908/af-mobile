<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page center p-4">
  <h1 class="title">登录</h1>
  <div class="fc g-3">
    <af-field id="user" label="手机号" placeholder="请输入手机号"></af-field>
    <af-field id="pass" label="密码" input-type="password" placeholder="请输入密码"></af-field>
    <button id="login" class="btn btn-block">登录</button>
  </div>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register('af-field');
await register('af-toast');

const userField = document.getElementById('user');
const passField = document.getElementById('pass');
const loginBtn = document.getElementById('login');
const toast = document.getElementById('toast');

loginBtn.addEventListener('click', async () => {
  // 清除之前的错误状态
  userField.setError('');
  passField.setError('');
  
  const phone = userField.value;
  const password = passField.value;
  
  // 验证手机号
  if (!phone) {
    userField.setError('请输入用户名或手机号');
    return;
  }
  
  // 验证密码
  if (!password) {
    passField.setError('请输入密码');
    return;
  }
  
  // 模拟登录成功
  if (phone === '13800000000' && password === '123456') {
    toast.show('登录成功', { type: 'success' });
  } else {
    toast.show('用户名或密码错误', { type: 'error' });
  }
});
</script>
</body>
</html>
