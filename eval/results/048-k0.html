<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
  <div class="page">
    <button class="btn" type="button" id="openSheet">筛选</button>
    <div class="sheet">
      <span class="body t-b">分类</span>
      <div class="f g-2">
        <span class="tag">女装</span>
        <span class="tag">男装</span>
      </div>
      <span class="body t-b">品牌</span>
      <div class="f g-2">
        <span class="tag">品牌A</span>
        <span class="tag">品牌B</span>
      </div>
      <span class="body t-b">价格区间</span>
      <div class="f g-2">
        <span class="tag">0-100</span>
        <span class="tag">100-500</span>
      </div>
      <button class="btn btn-block" type="button">确认</button>
    </div>
  </div>
</body>
</html>
