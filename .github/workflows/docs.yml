name: docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'demo/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 同 ci.yml：需 npm >=11 才能解析 overrides 到工作区根
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build demo
        run: npm run demo:build

      - name: Copy demo into site public
        run: mkdir -p site/public/demo && cp -r demo-dist/* site/public/demo/

      - name: Build vitepress docs
        run: npm run docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

      - uses: actions/deploy-pages@v5