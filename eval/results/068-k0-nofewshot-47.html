<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="f aic g-4">
  <!-- 消息入口：红点 -->
  <af-badge dot>
    <button class="btn btn-ghost btn-sm">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 12a8 8 0 0 1-8 8H5l1.6-2.4A8 8 0 1 1 21 12z"/>
      </svg>
    </button>
  </af-badge>

  <!-- 购物车入口：99+ -->
  <af-badge content="99" max="99">
    <button class="btn btn-ghost btn-sm">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6 7h12l1 13H5L6 7z"/>
        <path d="M9 7a3 3 0 0 1 6 0"/>
      </svg>
    </button>
  </af-badge>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register('af-badge');
</script>
</body>
</html>
