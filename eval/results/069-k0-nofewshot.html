<!doctype html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">酒店预订</nav>
  <div class="card p-4">
    <div class="body t-b">入住日期</div>
    <af-calendar id="cal" min="2023-04-01"></af-calendar>
  </div>
  <div class="card p-4">
    <div class="body t-b">房费明细</div>
    <div class="stats-grid">
      <div class="fc aic g-1"><span class="stat-num text-brand">¥299</span><span class="caption">每晚</span></div>
      <div class="fc aic g-1"><span class="stat-num">1晚</span><span class="caption">入住</span></div>
      <div class="fc aic g-1"><span class="stat-num">¥299</span><span class="caption">总计</span></div>
    </div>
  </div>
  <button class="btn btn-block" id="bookBtn">确认预订</button>
</div>
<script type="module">
import { fetchPage, go } from '/af-mobile.js';
import { signal, effect } from '/af-mobile.js';
import { AfCalendar } from '@af-mobile/ui';

const cal = document.getElementById('cal');
const bookBtn = document.getElementById('bookBtn');

cal.addEventListener('af-calendar:select', (e) => {
  console.log('Selected date:', e.detail.date);
});

bookBtn.addEventListener('click', async () => {
  const date = cal.value;
  if (!date) {
    alert('请选择入住日期');
    return;
  }
  try {
    await fetchPage('/api/book', { method: 'POST', body: JSON.stringify({ date }) });
    go('/success');
  } catch (err) {
    alert('预订失败');
  }
});
</script>
</body>
</html>
