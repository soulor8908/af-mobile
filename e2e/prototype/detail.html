<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="../../src/index.css">
<title>拾光咖啡 · 商品详情</title>
</head>
<body>
<div class="page p-0">

  <header class="navbar navbar-fixed">
    <button class="btn btn-ghost btn-sm">‹ 返回</button>
    <span class="flex-1"></span>
    <button class="btn btn-ghost btn-sm">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>
      收藏
    </button>
  </header>

  <img class="w-full aspect-1" style="object-fit:cover" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Premium%20caramel%20macchiato%20in%20tall%20glass%20with%20caramel%20drizzle%2C%20warm%20cafe%20light%2C%20product%20photography&image_size=square" alt="焦糖玛奇朵">
  <div class="dots py-2">
    <span class="dot dot-on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <div class="px-4 fc g-3">

    <section class="fc g-2">
      <div class="f aic g-2">
        <span class="price price-lg">¥32</span>
        <span class="price-del">¥42</span>
        <span class="tag tag-danger">限时券后</span>
      </div>
      <div class="title">焦糖玛奇朵（大杯 · 标准糖 · 热饮）</div>
      <div class="chips">
        <span class="tag tag-plain">意式浓缩基底</span>
        <span class="tag tag-plain">香草糖浆</span>
        <span class="tag tag-plain">焦糖淋面</span>
        <span class="tag tag-plain">可选燕麦奶</span>
      </div>
    </section>

    <section class="card">
      <div class="stats-grid">
        <div class="fc aic g-1"><span class="stat-num text-brand">2.4万</span><span class="caption">已售</span></div>
        <div class="fc aic g-1"><span class="stat-num text-success">4.9</span><span class="caption">评分</span></div>
        <div class="fc aic g-1"><span class="stat-num">86%</span><span class="caption">回购率</span></div>
      </div>
    </section>

    <section class="list">
      <div class="cell"><span class="body">杯型</span><span class="flex-1"></span><span class="caption">大杯 16oz</span></div>
      <div class="cell"><span class="body">甜度</span><span class="flex-1"></span><span class="caption">标准糖</span></div>
      <div class="cell"><span class="body">配送</span><span class="flex-1"></span><span class="caption text-success">3km 内 · 30 分钟达</span></div>
    </section>

    <section class="fc g-2">
      <div class="section-tt m-0">选择规格</div>
      <div class="seg seg-brand seg-blk">
        <button class="seg-it" aria-selected="true">中杯</button>
        <button class="seg-it">大杯</button>
        <button class="seg-it">超大杯</button>
      </div>
    </section>

    <section class="fc g-2">
      <div class="section-tt m-0">咖啡师说</div>
      <div class="card-media">
        <img class="aspect-16-9" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Barista%20making%20latte%20art%20in%20cozy%20coffee%20shop%2C%20warm%20light%2C%20documentary%20photography&image_size=landscape_16_9" alt="咖啡师制作">
        <div class="px-4 py-3 fc g-1">
          <span class="body t-m">双份浓缩 × 绵密奶泡</span>
          <span class="body">先尝焦糖的焦香，再喝奶泡下层的香草尾韵，建议不搅拌分层饮用。</span>
        </div>
      </div>
    </section>
  </div>

  <div class="cob cob-fx">
    <button class="btn btn-ghost">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      购物车
    </button>
    <button class="btn btn-plain flex-1">加入购物车</button>
    <button class="btn flex-1">立即购买</button>
  </div>

  <div style="height:80px"></div>
</div>
</body>
</html>
