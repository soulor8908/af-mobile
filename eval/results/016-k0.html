<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/aiflow-ui.css">
</head>
<body>
  <div class="page">
    <nav class="navbar">意见反馈</nav>
    <div class="form-row">
      <label class="label">问题类型</label>
      <input class="input" type="text" placeholder="请选择问题类型">
    </div>
    <div class="form-row">
      <label class="label">问题描述</label>
      <textarea class="textarea" placeholder="请详细描述您遇到的问题"></textarea>
    </div>
    <div class="form-row">
      <label class="label">联系方式</label>
      <input class="input" type="tel" placeholder="请输入手机号">
    </div>
    <button class="btn btn-block" type="button">提交</button>
  </div>
</body>
</html>
