<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page p-3">
  <nav class="navbar m-0">经营数据</nav>
  
  <div class="fc g-3">
    <!-- KPI 卡片区 -->
    <div class="card p-3">
      <div class="stats-grid">
        <div class="fc aic g-1">
          <span class="stat-num text-brand">¥12.5w</span>
          <span class="caption">总销售额</span>
        </div>
        <div class="fc aic g-1">
          <span class="stat-num text-success">843</span>
          <span class="caption">订单量</span>
        </div>
        <div class="fc aic g-1">
          <span class="stat-num text-muted">¥148</span>
          <span class="caption">客单价</span>
        </div>
        <div class="fc aic g-1">
          <span class="stat-num text-danger">1.2%</span>
          <span class="caption">退款率</span>
        </div>
      </div>
    </div>

    <!-- 折线图区 -->
    <div class="card p-3">
      <div class="section-tt">近7日销售额趋势</div>
      <af-chart-line id="salesChart" smooth legend height="240"></af-chart-line>
    </div>
  </div>
</div>

<script type="module">
import { registerChart } from '/af-mobile/charts/index.js';

await registerChart('af-chart-line');

const chart = document.getElementById('salesChart');
chart.labels = ['10-24', '10-25', '10-26', '10-27', '10-28', '10-29', '10-30'];
chart.series = [{ name: '销售额', values: [12000, 15000, 11000, 18000, 22000, 19500, 24000] }];
</script>
</body>
</html>
