<!doctype html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">编辑收货地址</nav>
  <div class="card p-4">
    <af-field label="收货人" required>
      <input class="input" type="text" placeholder="请输入收货人姓名">
    </af-field>
    <af-field label="手机号" required>
      <input class="input" type="tel" placeholder="请输入手机号">
    </af-field>
    <af-field label="所在地区" required>
      <input class="input" type="text" placeholder="请选择所在地区" readonly>
    </af-field>
    <af-field label="详细地址" required>
      <textarea class="input" rows="3" placeholder="请输入详细地址"></textarea>
    </af-field>
    <div class="cell aic jcsb py-3">
      <span class="body">设为默认地址</span>
      <af-switch id="defaultSwitch" checked></af-switch>
    </div>
  </div>
  <div class="cob">
    <button class="btn btn-block" id="saveBtn">保存</button>
  </div>
  <af-toast id="toast"></af-toast>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register('af-field', 'af-switch', 'af-toast');
const toast = document.getElementById('toast');
const saveBtn = document.getElementById('saveBtn');
saveBtn.addEventListener('click', () => {
  toast.show('已保存', { type: 'success' });
});
</script>
</body>
</html>
