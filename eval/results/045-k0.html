<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/aiflow-ui.css">
</head>
<body>
  <div class="page">
    <div class="steps">
      <div class="step step-active">
        <span class="step-circle">1</span>
        <span class="step-label">下单</span>
      </div>
      <div class="step step-active">
        <span class="step-circle">2</span>
        <span class="step-label">支付</span>
      </div>
      <div class="step">
        <span class="step-circle">3</span>
        <span class="step-label">发货</span>
      </div>
      <div class="step">
        <span class="step-circle">4</span>
        <span class="step-label">收货</span>
      </div>
    </div>
    <div class="list-item">
      <span class="body flex-1">当前状态</span>
      <span class="tag tag-warn">待发货</span>
    </div>
  </div>
</body>
</html>
