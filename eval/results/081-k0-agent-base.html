<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>经营数据看板</title>
  <link rel="stylesheet" href="../../src/index.css">
</head>
<body>
  <div class="page">
    <header class="navbar">
      <h1 class="title">经营数据看板</h1>
    </header>

    <div class="stats-grid p-3">
      <div class="card p-3">
        <div class="caption">今日销售额</div>
        <div class="stat-num">¥18,900</div>
      </div>
      <div class="card p-3">
        <div class="caption">今日订单</div>
        <div class="stat-num">326</div>
      </div>
      <div class="card p-3">
        <div class="caption">客单价</div>
        <div class="stat-num">¥58.0</div>
      </div>
      <div class="card p-3">
        <div class="caption">支付转化率</div>
        <div class="stat-num">4.2%</div>
      </div>
    </div>

    <section class="section p-3">
      <h2 class="section-tt">近 7 日销售额趋势</h2>
      <af-chart-line id="chart" smooth legend></af-chart-line>
    </section>
  </div>

  <script type="module">
    import { registerChart } from '../../src/charts/index.js';
    registerChart('af-chart-line');

    const pad = (n) => String(n).padStart(2, '0');
    const labels = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      labels.push(pad(d.getMonth() + 1) + '-' + pad(d.getDate()));
    }

    const chart = document.getElementById('chart');
    chart.labels = labels;
    chart.series = [{ name: '销售额', values: [12800, 14200, 11600, 15800, 17300, 14900, 18900] }];
    chart.smooth = true;
  </script>
</body>
</html>
