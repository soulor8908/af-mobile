<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <af-navbar title="收银台" show-back back-text="返回">
    <div class="flex-1 f aic jce">
      <span class="price price-lg">¥256.00</span>
    </div>
  </af-navbar>
  <div class="p-4">
    <div class="card">
      <div class="p-3">
        <div class="form-row">
          <span class="label">支付方式</span>
          <af-picker id="bankPicker" title="选择银行卡"></af-picker>
        </div>
      </div>
    </div>
  </div>
  <af-toast id="toast"></af-toast>
  <af-number-keyboard id="keyboard" random title="输入支付密码" maxlength="6"></af-number-keyboard>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register('af-navbar', 'af-picker', 'af-number-keyboard', 'af-toast');

const keyboard = document.getElementById('keyboard');
const toast = document.getElementById('toast');
const bankPicker = document.getElementById('bankPicker');

// 设置银行卡选项
bankPicker.columns = [['招商银行', '工商银行', '建设银行']];

// 进入页面即弹出数字键盘
keyboard.open();

// 密码输入完成事件
keyboard.addEventListener('af-number-keyboard:complete', async (e) => {
  const password = e.detail.value;
  // 这里可以添加实际的支付逻辑
  await toast.show('支付成功', { type: 'success', duration: 2000 });
  // 支付成功后可以返回上一页或跳转到结果页
  // history.back();
});

// 银行卡选择事件（可选）
bankPicker.addEventListener('af-picker:confirm', (e) => {
  console.log('选择的银行卡:', e.detail.values[0]);
});
</script>
</body>
</html>
