<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">资讯</nav>
  <af-pull-refresh id="refresh">
    <af-list id="list"></af-list>
  </af-pull-refresh>
</div>
<script type="module">
import { register } from '/af-mobile.js';

await register('af-pull-refresh');
await register('af-list');

const refresh = document.getElementById('refresh');
const list = document.getElementById('list');

const mockData = [
  { id: 1, title: '科技巨头发布新款AI芯片，算力提升300%', desc: '该芯片采用全新架构，专为大规模语言模型训练设计，预计明年量产。', time: '10分钟前', img: 'https://picsum.photos/seed/1/72/72' },
  { id: 2, title: '全球气候峰会达成新共识，碳中和目标提前', desc: '各国代表在经过激烈谈判后，一致同意加快能源转型步伐。', time: '30分钟前', img: 'https://picsum.photos/seed/2/72/72' },
  { id: 3, title: '新能源汽车销量再创新高，市场渗透率突破40%', desc: '随着电池技术的进步和充电设施的完善，消费者购买意愿显著增强。', time: '1小时前', img: 'https://picsum.photos/seed/3/72/72' },
  { id: 4, title: 'SpaceX星舰第四次试飞成功，进入预定轨道', desc: '这是人类航天史上的重要里程碑，为火星移民计划奠定了基础。', time: '2小时前', img: 'https://picsum.photos/seed/4/72/72' },
  { id: 5, title: '国产大飞机C919获得欧洲适航证，即将开启国际航线', desc: '标志着中国航空制造业迈出了关键一步，打破了波音和空客的垄断。', time: '3小时前', img: 'https://picsum.photos/seed/5/72/72' }
];

list.data = mockData;

list.renderItem = (item) => `
  <div class="list-item g-3">
    <div class="thumb">
      <img src="${item.img}" alt="" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="flex-1 fc jcsb">
      <div class="body t-b ellipsis-2">${item.title}</div>
      <div class="caption text-muted ellipsis">${item.desc}</div>
      <div class="caption text-muted">${item.time}</div>
    </div>
  </div>
`;

refresh.addEventListener('af-pull-refresh:refresh', async () => {
  await new Promise(resolve => setTimeout(resolve, 2000));
  list.data = mockData;
  refresh.endRefresh();
});
</script>
</body>
</html>
