<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
  <div class="page">
    <div class="form-row">
      <label class="label">手机号</label>
      <input class="input" type="tel" placeholder="请输入手机号">
    </div>
    <div class="form-row">
      <label class="label">密码</label>
      <input class="input" type="password" placeholder="请输入密码">
    </div>
    <div class="form-row">
      <label class="label">确认密码</label>
      <input class="input" type="password" placeholder="请再次输入密码">
    </div>
    <div class="form-row">
      <label class="checkbox">我已阅读并同意协议</label>
    </div>
    <div class="form-err">请完整填写注册信息</div>
    <button class="btn btn-block" type="button">注册</button>
  </div>
</body>
</html>
