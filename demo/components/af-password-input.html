<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>af-password-input demo - af-mobile</title>
  <link rel="stylesheet" href="../../src/index.css">
  <!-- 主题防闪：先于组件挂载恢复 localStorage 主题 -->
  <script>try{var saved=localStorage.getItem('theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch(e){}</script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow"><a href="../index.html" class="subtitle">← 返回</a></p>
      <h1 class="display">af-password-input 密码/验证码输入</h1>
    </section>

    <section class="card fc g-3 p-3">
      <div class="fc g-2">
        <span class="body">支付密码（掩码）</span>
        <af-password-input id="pi" length="6" mask></af-password-input>
      </div>
      <div class="fc g-2">
        <span class="body">短信验证码（明文）</span>
        <af-password-input id="pi2" length="4" mask="false"></af-password-input>
      </div>
    </section>

    <af-number-keyboard id="kb" title="安全键盘"></af-number-keyboard>

    <p class="caption" id="log">点击格子唤起数字键盘 · 输满自动收起</p>

    <section id="props" class="card"></section>
  </main>

  <script type="module">
    import { AfPasswordInput } from '../../src/components/af-password-input.js';
    customElements.define('af-password-input', AfPasswordInput);
    import { AfNumberKeyboard } from '../../src/components/af-number-keyboard.js';
    customElements.define('af-number-keyboard', AfNumberKeyboard);
    import { createPropsPanel } from '../props-panel.js';

    const kb = document.getElementById('kb');
    const log = document.getElementById('log');
    let active = null;

    // 配对接线：点击格子 → 打开键盘；键盘 input/delete → 同步格子；close → 失焦
    function bind(pi) {
      pi.addEventListener('click', () => {
        active = pi;
        kb.maxlength = pi.length;
        kb.value = pi.value;
        kb.title = pi.mask ? '安全键盘' : '验证码键盘';
        pi.focused = true;
        kb.open();
      });
      pi.addEventListener('af-password-input:complete', (e) => {
        log.textContent = `输入完成：${e.detail.value}`;
        kb.close('complete');
      });
    }
    bind(document.getElementById('pi'));
    bind(document.getElementById('pi2'));

    kb.addEventListener('af-number-keyboard:input', (e) => { if (active) active.value = e.detail.value; });
    kb.addEventListener('af-number-keyboard:delete', (e) => { if (active) active.value = e.detail.value; });
    kb.addEventListener('af-number-keyboard:close', () => { if (active) { active.focused = false; active = null; } });

    createPropsPanel(document.getElementById('props'), [
      { prop: 'length', label: '格子数', type: 'number', min: 4, max: 8, step: 1 },
      { prop: 'mask', label: '掩码', type: 'boolean' },
      { prop: 'focused', label: '聚焦光标', type: 'boolean' },
    ], document.getElementById('pi'));
  </script>
</body>
</html>
