<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商品排序</title>
<link rel="stylesheet" href="../../src/index.css">
</head>
<body>
<div class="page p-0">
  <header class="navbar">
    <button class="btn btn-ghost btn-sm" aria-label="返回">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 4-8 8 8 8"/></svg>
    </button>
    <h1 class="title flex-1 t-center">全部商品</h1>
    <span class="btn-sm shrink-0"></span>
  </header>

  <div class="p-3">
    <af-dropdown id="sort" placeholder="综合排序"></af-dropdown>
  </div>

  <div class="list" id="goods"></div>
</div>

<script type="module">
import { register } from '../../src/index.js';
await register('af-dropdown');

const ITEMS = [
  { title: '云感纯棉 T 恤', price: 59, sales: 1200, img: 'https://placehold.co/144x144' },
  { title: '直筒牛仔裤', price: 129, sales: 860, img: 'https://placehold.co/144x144' },
  { title: '轻量防晒衣', price: 99, sales: 2100, img: 'https://placehold.co/144x144' },
  { title: '经典小白鞋', price: 199, sales: 640, img: 'https://placehold.co/144x144' },
  { title: '纯棉袜子 5 双装', price: 29.9, sales: 3400, img: 'https://placehold.co/144x144' },
  { title: '城市通勤双肩包', price: 149, sales: 430, img: 'https://placehold.co/144x144' },
].map((it, i) => Object.assign({}, it, { base: i }));

const goods = document.getElementById('goods');
const render = (rows) => {
  goods.innerHTML = rows.map((p) => `
    <div class="list-item g-3">
      <img class="thumb" src="${p.img}" alt="">
      <div class="flex-1 min-w-0 fc g-1">
        <span class="body ellipsis">${p.title}</span>
        <span class="caption text-muted">月销 ${p.sales}</span>
      </div>
      <span class="price">¥${p.price.toFixed(2)}</span>
    </div>`).join('');
};
render(ITEMS);

const sort = document.getElementById('sort');
sort.options = ['综合', '销量', '价格升', '价格降'];
sort.addEventListener('af-dropdown:select', (e) => {
  const i = e.detail.index;
  const rows = ITEMS.slice();
  if (i === 1) rows.sort((a, b) => b.sales - a.sales);
  else if (i === 2) rows.sort((a, b) => a.price - b.price);
  else if (i === 3) rows.sort((a, b) => b.price - a.price);
  else rows.sort((a, b) => a.base - b.base);
  render(rows);
});
</script>
</body>
</html>
