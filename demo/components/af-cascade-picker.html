<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>af-cascade-picker demo - af-mobile</title>
  <link rel="stylesheet" href="../../src/index.css">
  <!-- 主题防闪：先于组件挂载恢复 localStorage 主题 -->
  <script>try{var saved=localStorage.getItem('theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch(e){}</script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow"><a href="../index.html" class="subtitle">← 返回</a></p>
      <h1 class="display">af-cascade-picker 级联选择器</h1>
    </section>

    <div class="card">
      <div class="cell"><span class="body">省市区</span><button class="btn btn-sm btn-ghost" id="openBtn">选择</button></div>
    </div>

    <p class="caption" id="log">点击「选择」打开 · 继承 af-picker 滚轮内核</p>

    <af-cascade-picker id="cp" title="选择地区"></af-cascade-picker>

    <section id="props" class="card"></section>
  </main>

  <script type="module">
    import { AfCascadePicker } from '../../src/components/af-cascade-picker.js';
    customElements.define('af-cascade-picker', AfCascadePicker);
    import { createPropsPanel } from '../props-panel.js';

    const cp = document.getElementById('cp');
    cp.tree = [
      { value: '广东', label: '广东', children: [
        { value: '深圳', label: '深圳', children: [
          { value: '南山', label: '南山' },
          { value: '福田', label: '福田' },
        ] },
        { value: '广州', label: '广州', children: [
          { value: '天河', label: '天河' },
          { value: '越秀', label: '越秀' },
        ] },
      ] },
      { value: '浙江', label: '浙江', children: [
        { value: '杭州', label: '杭州', children: [
          { value: '西湖', label: '西湖' },
          { value: '滨江', label: '滨江' },
        ] },
      ] },
    ];

    document.getElementById('openBtn').addEventListener('click', () => cp.open());
    cp.addEventListener('af-picker:confirm', (e) => {
      document.getElementById('log').textContent = `选中 ${e.detail.values.join(' / ')}`;
    });

    createPropsPanel(document.getElementById('props'), [
      { prop: 'title', label: '标题', type: 'string' },
    ], cp);
  </script>
</body>
</html>
