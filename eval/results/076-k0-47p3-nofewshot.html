<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page center p-4">
  <div class="fc g-4" style="width: 100%; max-width: 320px;">
    <div class="fc g-2">
      <h1 class="title t-center">请输入支付密码</h1>
      <p class="body text-muted t-center">用于验证身份，保障资金安全</p>
    </div>
    <af-password-input id="pi" length="6" mask></af-password-input>
  </div>
</div>

<af-number-keyboard id="kb" random title="安全键盘"></af-number-keyboard>
<af-toast id="toast"></af-toast>

<script type="module">
import { register } from '/af-mobile.js';

await register('af-password-input', 'af-number-keyboard', 'af-toast');

const kb = document.getElementById('kb');
const pi = document.getElementById('pi');
const toast = document.getElementById('toast');

kb.addEventListener('af-number-keyboard:input', (e) => {
  pi.value = e.detail.value;
});

kb.addEventListener('af-number-keyboard:delete', (e) => {
  pi.value = e.detail.value;
});

kb.addEventListener('af-number-keyboard:complete', (e) => {
  toast.show('支付成功', { type: 'success' });
});

kb.open();
</script>
</body>
</html>
