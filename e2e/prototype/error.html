<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="../../src/index.css">
<title>拾光咖啡 · 网络错误</title>
</head>
<body>
<div class="page p-0">

  <header class="navbar navbar-fixed">
    <button class="btn btn-ghost btn-sm">‹ 返回</button>
    <span class="flex-1"></span>
  </header>

  <!-- 错误态：page-empty 模式变体（错误图标 + 语义色提示 + 重试 CTA） -->
  <div class="page center fc g-3 p-4">
    <span class="icon-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span>
    <div class="fc aic g-1">
      <span class="title">网络开小差了</span>
      <span class="body text-muted">内容加载失败，请检查网络后重试</span>
    </div>
    <div class="f g-2">
      <a class="btn btn-plain" href="index.html">返回首页</a>
      <button class="btn" id="retry">重新加载</button>
    </div>
  </div>

</div>
</body>
</html>
