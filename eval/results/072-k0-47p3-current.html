<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <section class="hero-grad p-4 fc aic jcc">
    <span class="eyebrow">FLASH SALE</span>
    <h1 class="display">限时秒杀</h1>
    <div class="f aic g-2">
      <span class="body text-onbrand">距结束仅剩</span>
      <af-countdown id="cd" time="7200" autostart></af-countdown>
    </div>
  </section>

  <div class="p-3">
    <div class="grid-2 g-2" id="product-list"></div>
  </div>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register('af-countdown');

const cd = document.getElementById('cd');
cd.addEventListener('af-countdown:change', (e) => console.log('剩余:', e.detail.remaining));
cd.addEventListener('af-countdown:end', () => console.log('秒杀结束'));

const products = [
  { id: 1, title: '无线降噪蓝牙耳机 超长续航', price: '199.00', oldPrice: '599.00', tag: '3.3折', img: 'https://picsum.photos/seed/p1/300/300' },
  { id: 2, title: '智能运动手表 心率监测防水', price: '299.00', oldPrice: '899.00', tag: '3.3折', img: 'https://picsum.photos/seed/p2/300/300' },
  { id: 3, title: '复古胶片相机 拍立得', price: '450.00', oldPrice: '699.00', tag: '限时特惠', img: 'https://picsum.photos/seed/p3/300/300' },
  { id: 4, title: '便携式榨汁机 家用多功能', price: '89.00', oldPrice: '199.00', tag: '4.5折', img: 'https://picsum.photos/seed/p4/300/300' },
];

const list = document.getElementById('product-list');
list.innerHTML = products.map(item => `
  <div class="card-media">
    <div class="aspect-1">
      <img src="${item.img}" alt="${item.title}" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="p-2 fc g-1">
      <div class="body ellipsis-2">${item.title}</div>
      <div class="f aic jcsb">
        <div class="f aic g-1">
          <span class="price">¥${item.price}</span>
          <span class="price-del">¥${item.oldPrice}</span>
        </div>
        <span class="tag tag-danger">${item.tag}</span>
      </div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
