<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <af-navbar title="收银台" show-back back-text="返回">
    <div slot="right" class="body t-b">¥256.00</div>
  </af-navbar>
  
  <div class="card p-4">
    <div class="form-row">
      <label class="label">选择银行卡</label>
      <af-picker id="bankPicker" title="选择银行卡"></af-picker>
    </div>
    
    <div class="form-row">
      <label class="label">支付密码</label>
      <input class="input" type="password" placeholder="请输入支付密码" readonly>
    </div>
  </div>
  
  <af-number-keyboard id="keyboard" random title="输入支付密码" maxlength="6"></af-number-keyboard>
  <af-toast id="toast"></af-toast>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register('af-navbar', 'af-picker', 'af-number-keyboard', 'af-toast');

const keyboard = document.getElementById('keyboard');
const toast = document.getElementById('toast');
const bankPicker = document.getElementById('bankPicker');

// 设置银行卡选择器
bankPicker.columns = [['招商银行', '工商银行', '建设银行']];

// 数字键盘事件处理
keyboard.addEventListener('af-number-keyboard:complete', (e) => {
  toast.show('支付成功', { type: 'success' });
  keyboard.close();
});

// 页面加载时自动打开数字键盘
keyboard.open();
</script>
</body>
</html>
