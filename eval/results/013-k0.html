<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/aiflow-ui.css">
</head>
<body>
  <div class="page">
    <nav class="navbar">新增地址</nav>
    <div class="form-row">
      <label class="label">收件人</label>
      <input class="input" type="text" placeholder="请输入收件人">
    </div>
    <div class="form-row">
      <label class="label">手机号</label>
      <input class="input" type="tel" placeholder="请输入手机号">
    </div>
    <div class="form-row">
      <label class="label">省市区</label>
      <input class="input" type="text" placeholder="请选择省市区">
    </div>
    <div class="form-row">
      <label class="label">详细地址</label>
      <textarea class="textarea" placeholder="请输入详细地址"></textarea>
    </div>
    <div class="form-row">
      <label class="label">设为默认</label>
      <span class="switch"><span class="switch-thumb"></span></span>
    </div>
    <button class="btn btn-block" type="button">保存</button>
  </div>
</body>
</html>
