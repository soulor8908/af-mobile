<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <af-navbar title="周报"></af-navbar>
  <div class="p-3">
    <div class="card">
      <div class="section-tt">销量统计</div>
      <af-chart-bar id="barChart" height="200"></af-chart-bar>
    </div>
    <div class="card m-3">
      <div class="section-tt">访问量趋势</div>
      <af-chart-line id="lineChart" height="200" variant="area"></af-chart-line>
    </div>
  </div>
</div>
<script type="module">
import { registerChart } from '/af-mobile/charts/index.js';
await registerChart('af-chart-bar');
await registerChart('af-chart-line');

const barChart = document.getElementById('barChart');
const lineChart = document.getElementById('lineChart');

// 设置图表数据
barChart.columns = ['销量'];
barChart.labels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
barChart.series = [[120, 150, 180, 200, 190, 220, 250]];

lineChart.columns = ['访问量'];
lineChart.labels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
lineChart.series = [[300, 350, 400, 380, 420, 450, 480]];
</script>
</body>
</html>
