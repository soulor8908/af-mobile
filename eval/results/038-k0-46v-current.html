<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page center p-4">
  <h1 class="title">操作确认</h1>
  <p class="body text-muted">点击下方按钮打开删除确认对话框</p>
  <button class="btn btn-danger" id="openDialog">删除项目</button>
  
  <af-dialog id="deleteDialog" title="确认删除" open>
    <div slot="body">
      <p class="body">确定要删除这个项目吗？此操作无法撤销。</p>
    </div>
    <div slot="footer">
      <button class="btn btn-ghost btn-block" data-act="cancel">取消</button>
      <button class="btn btn-block btn-danger" data-act="confirm">确认删除</button>
    </div>
  </af-dialog>
</div>

<script type="module">
const dialog = document.getElementById('deleteDialog');
const openBtn = document.getElementById('openDialog');

// 点击按钮打开对话框
openBtn.addEventListener('click', () => {
  dialog.open();
});

// 处理确认按钮点击
dialog.querySelector('[data-act="confirm"]').addEventListener('click', () => {
  dialog.close('confirm');
});

// 处理取消按钮点击
dialog.querySelector('[data-act="cancel"]').addEventListener('click', () => {
  dialog.close('cancel');
});

// 监听对话框关闭事件
dialog.addEventListener('af-dialog:close', (e) => {
  const action = e.detail.action;
  if (action === 'confirm') {
    // 执行删除操作
    console.log('执行删除操作');
    // 这里可以添加实际的删除逻辑
  } else {
    console.log('取消删除');
  }
});
</script>
</body>
</html>
