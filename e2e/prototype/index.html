<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="../../src/index.css">
<title>拾光咖啡 · 首页</title>
</head>
<body>
<div class="page p-0">

  <header class="navbar navbar-fixed">
    <span class="body t-m">拾光咖啡</span>
    <span class="flex-1"></span>
    <button class="btn btn-ghost btn-sm">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.1-7-11a7 7 0 0 1 14 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      门店
    </button>
  </header>

  <div class="p-4 fc g-4">

    <section class="hero-grad fc g-2">
      <div class="eyebrow">PICKUP COFFEE</div>
      <div class="display">早安，来一杯吗</div>
      <div class="subtitle">今日第二杯半价 · 会员日双倍积分</div>
    </section>

    <div class="sb-wrap">
      <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search-input" type="search" placeholder="搜索咖啡、茶饮、点心">
    </div>

    <section class="fc g-2">
      <div class="section-tt m-0">点单分类</div>
      <div class="grid-3 g-2">
        <div class="fc aic g-1">
          <span class="icon-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 8h1a3 3 0 0 1 0 6h-1M3 8h14v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><path d="M7 2v3M11 2v3M15 2v3"/></svg></span>
          <span class="caption">经典咖啡</span>
        </div>
        <div class="fc aic g-1">
          <span class="icon-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg></span>
          <span class="caption">特调气泡</span>
        </div>
        <div class="fc aic g-1">
          <span class="icon-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h18v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7z"/><path d="M3 7l2-4h14l2 4M9 12h6"/></svg></span>
          <span class="caption">烘焙点心</span>
        </div>
        <div class="fc aic g-1">
          <span class="icon-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span>
          <span class="caption">外带专区</span>
        </div>
        <div class="fc aic g-1">
          <span class="icon-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></span>
          <span class="caption">会员福利</span>
        </div>
        <div class="fc aic g-1">
          <span class="icon-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a8 8 0 0 1-8 8H5l1.6-2.4A8 8 0 1 1 21 12z"/></svg></span>
          <span class="caption">咖啡豆</span>
        </div>
      </div>
    </section>

    <section class="fc g-2">
      <div class="f aic jcsb">
        <div class="section-tt m-0">今日推荐</div>
        <button class="btn btn-ghost btn-mini">全部 ›</button>
      </div>
      <div class="grid-2 g-2">
        <div class="card-media">
          <img class="aspect-1" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=A%20professional%20photo%20of%20a%20caramel%20latte%20in%20a%20ceramic%20cup%20on%20wooden%20table%2C%20warm%20morning%20light%2C%20cozy%20coffee%20shop%20atmosphere&image_size=square" alt="焦糖拿铁">
          <div class="px-3 py-2 fc g-1">
            <div class="body t-m">焦糖拿铁</div>
            <div class="f aic jcsb">
              <span class="price">¥28</span>
              <span class="tag tag-danger">半价</span>
            </div>
          </div>
        </div>
        <div class="card-media">
          <img class="aspect-1" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Iced%20americano%20coffee%20in%20glass%20cup%20with%20condensation%2C%20minimal%20light%20background%2C%20product%20photography&image_size=square" alt="冰美式">
          <div class="px-3 py-2 fc g-1">
            <div class="body t-m">冰美式</div>
            <div class="f aic jcsb">
              <span class="price">¥18</span>
              <span class="tag tag-ok">新品</span>
            </div>
          </div>
        </div>
        <div class="card-media">
          <img class="aspect-1" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Matcha%20latte%20with%20latte%20art%20in%20ceramic%20cup%2C%20soft%20green%20tone%2C%20cafe%20product%20photography&image_size=square" alt="抹茶拿铁">
          <div class="px-3 py-2 fc g-1">
            <div class="body t-m">抹茶拿铁</div>
            <div class="f aic jcsb">
              <span class="price">¥26</span>
              <span class="tag tag-plain">人气</span>
            </div>
          </div>
        </div>
        <div class="card-media">
          <img class="aspect-1" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Croissant%20and%20small%20cakes%20on%20a%20wooden%20plate%2C%20warm%20bakery%20light%2C%20product%20photography&image_size=square" alt="可颂套餐">
          <div class="px-3 py-2 fc g-1">
            <div class="body t-m">可颂套餐</div>
            <div class="f aic jcsb">
              <span class="price">¥32</span>
              <span class="tag tag-plain-ok">省6元</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="bg-grad-brand r-l px-4 py-3 f aic jcsb">
      <div class="fc g-1">
        <span class="body t-semibold text-onbrand">开通会员卡</span>
        <span class="caption text-onbrand">每单立减 3 元 · 生日免费升杯</span>
      </div>
      <button class="btn btn-plain btn-sm">9 元/月</button>
    </section>

    <section class="fc g-2">
      <div class="section-tt m-0">大家都在搜</div>
      <div class="chips">
        <span class="tag">生椰拿铁</span>
        <span class="tag">燕麦拿铁</span>
        <span class="tag">dirty</span>
        <span class="tag tag-plain">手冲单品</span>
        <span class="tag">桂花生酪</span>
        <span class="tag">橙C美式</span>
        <span class="tag">冷萃</span>
        <span class="tag tag-plain">挂耳礼盒</span>
      </div>
    </section>
  </div>

  <nav class="tabbar tabbar-fixed">
    <button class="tab-item" aria-selected="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10z"/></svg>
      首页
    </button>
    <button class="tab-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      点单
    </button>
    <button class="tab-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h6M8 6V4h8v2M7 6l1 14h8l1-14"/></svg>
      订单
    </button>
    <button class="tab-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      我的
    </button>
  </nav>

  <div style="height:66px"></div>
</div>
</body>
</html>
