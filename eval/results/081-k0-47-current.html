<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">经营数据</nav>
  
  <section class="card">
    <div class="stats-grid">
      <div class="fc aic g-1">
        <span class="stat-num text-brand">¥12,450</span>
        <span class="caption">总销售额</span>
      </div>
      <div class="fc aic g-1">
        <span class="stat-num text-success">328</span>
        <span class="caption">订单数</span>
      </div>
      <div class="fc aic g-1">
        <span class="stat-num">¥380</span>
        <span class="caption">客单价</span>
      </div>
      <div class="fc aic g-1">
        <span class="stat-num text-danger">1.2%</span>
        <span class="caption">退款率</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-tt">近7日销售趋势</div>
    <af-chart-line id="chart" smooth height="300"></af-chart-line>
  </section>
</div>

<script type="module">
import { registerChart } from '/af-mobile.js';

await registerChart('af-chart-line');

const chart = document.getElementById('chart');
chart.labels = ['10-24', '10-25', '10-26', '10-27', '10-28', '10-29', '10-30'];
chart.series = [{
  name: '销售额',
  values: [8200, 9320, 9010, 12450, 11200, 13800, 12450]
}];
</script>
</body>
</html>
