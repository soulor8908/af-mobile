<!doctype html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page safe-bottom">
  <af-chat placeholder="请输入您的问题" session="welcomeSession"></af-chat>
</div>
<script type="module">
import { registerChat, createSession } from '@af-mobile/ui/chat';
import { fetchPage } from '/af-mobile.js';

// 注册 af-chat 子库
await registerChat();

// 创建欢迎会话
const welcomeSession = createSession({ endpoint: '/api/chat' });

// 发送欢迎消息
const welcomeMessage = await fetchPage('/api/chat/welcome');
welcomeSession.send(welcomeMessage);

// 监听发送事件
document.querySelector('af-chat').addEventListener('af-chat:send', async (e) => {
  const message = e.detail.text;
  const response = await fetchPage('/api/chat', { method: 'POST', body: JSON.stringify({ message }) });
  e.target.session.send(response);
});
</script>
</body>
</html>
