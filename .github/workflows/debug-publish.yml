# 临时诊断 workflow（第 2 步）：真实 publish @af-mobile/ui@1.9.0，完整输出定位 changesets 吞掉的报错
# 根因定位后删除（D-007 发布链调试）
name: Debug publish real

on:
  workflow_dispatch:

permissions:
  id-token: write   # npm provenance（OIDC）

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm version
        run: npm install -g npm@11.9.0

      - run: npm ci

      # 与 release.yml 的 changesets step 同 env（含 auth），真实 publish
      - name: Real npm publish (root = @af-mobile/ui)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_provenance: 'true'
          HUSKY: '0'
        run: |
          set -x
          npm whoami
          npm view @af-mobile/ui version || true
          npm publish --access public
          echo "=== publish exit: $? ==="
