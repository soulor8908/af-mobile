name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Step 1: 白名单三源同步检查（A 源码 ↔ B whitelist-v1.json ↔ C Prompt 注入）
      - name: Whitelist sync (3-source diff)
        run: npm run whitelist:check

      # Step 2: 体积检查（L1+L2 CSS + L3 JS）
      - name: Size budget check
        run: npm run size

      # Step 3: 测试
      - name: Test
        run: npm test

      # Step 4: ESLint 自检
      - name: ESLint check
        run: npx eslint src/ --max-warnings 0
        continue-on-error: true
