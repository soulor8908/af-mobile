<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aiflow-ui e2e</title>
</head>
<body>
  <!-- af-dialog -->
  <section data-testid="dialog-section">
    <button id="open-dialog" class="btn">打开 dialog</button>
    <af-dialog id="dlg" title="确认操作">
      <div slot="body">确认删除该条目？</div>
      <div slot="footer">
        <button id="dlg-cancel" class="btn btn-ghost">取消</button>
        <button id="dlg-ok" class="btn btn-danger">确定</button>
      </div>
    </af-dialog>
  </section>

  <!-- af-action-sheet -->
  <section data-testid="sheet-section">
    <button id="open-sheet" class="btn">打开 action-sheet</button>
    <af-action-sheet id="sheet" title="分享到"></af-action-sheet>
  </section>

  <!-- af-dropdown -->
  <section data-testid="dropdown-section">
    <af-dropdown id="dd" placeholder="请选择城市"></af-dropdown>
  </section>

  <!-- af-picker -->
  <section data-testid="picker-section">
    <button id="open-picker" class="btn">打开 picker</button>
    <af-picker id="picker" title="选择日期"></af-picker>
  </section>

  <!-- af-swiper -->
  <section data-testid="swiper-section">
    <af-swiper id="swp" loop style="width:320px;height:120px;">
      <div style="width:100%;height:100%;background:var(--c-brand);display:flex;align-items:center;justify-content:center;color:#fff">1</div>
      <div style="width:100%;height:100%;background:var(--c-success);display:flex;align-items:center;justify-content:center;color:#fff">2</div>
      <div style="width:100%;height:100%;background:var(--c-danger);display:flex;align-items:center;justify-content:center;color:#fff">3</div>
    </af-swiper>
    <p id="swiper-index">当前索引：0</p>
  </section>

  <!-- af-swipe-cell -->
  <section data-testid="swipe-section">
    <af-swipe-cell id="swc">
      <div slot="content">滑动单元格内容</div>
      <div slot="right">
        <button class="btn btn-danger" data-action="delete">删除</button>
        <button class="btn btn-ghost" data-action="more">更多</button>
      </div>
    </af-swipe-cell>
  </section>

  <!-- af-pull-refresh -->
  <section data-testid="pull-section">
    <af-pull-refresh id="pr">
      <div style="height:1600px;padding:16px;">向下拉动刷新（顶部内容）</div>
    </af-pull-refresh>
  </section>

  <!-- af-backtop -->
  <section data-testid="backtop-section">
    <af-backtop id="bt" threshold="100"></af-backtop>
    <div style="height:2000px;">长页面，用于触发回到顶部</div>
  </section>

  <!-- af-img -->
  <section data-testid="img-section">
    <af-img id="img-eager" lazy="false" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Crect%20width='40'%20height='40'%20fill='%234285f4'/%3E%3C/svg%3E" alt="eager"></af-img>
    <div style="height:2000px;"></div>
    <af-img id="img-lazy" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Crect%20width='40'%20height='40'%20fill='%2334a853'/%3E%3C/svg%3E" alt="lazy"></af-img>
    <af-img id="img-fail" lazy="false" src="data:image/png;base64,not-a-valid-image" fail-src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Crect%20width='40'%20height='40'%20fill='%23ea4335'/%3E%3C/svg%3E" alt="fail"></af-img>
  </section>

  <!-- router（SPA 路由：query / scrollBehavior / outlet 抛错） -->
  <section data-testid="router-section">
    <button id="router-go-query" class="btn">go /list?page=2</button>
    <button id="router-go-el" class="btn">go /el（滚动到元素）</button>
    <button id="router-go-bad" class="btn">go /bad（outlet 抛错）</button>
    <div id="router-app" data-router-outlet style="min-height:120px;border:1px dashed var(--c-border);"></div>
    <p id="router-query-out"></p>
    <p id="router-error-out"></p>
  </section>

  <!-- i18n（复数规则：en / ar） -->
  <section data-testid="i18n-section">
    <button id="i18n-en" class="btn">en-US</button>
    <button id="i18n-ar" class="btn">ar-SA</button>
    <p id="i18n-plural-out"></p>
  </section>

  <script type="module">
    import '../src/index.css';
    import { registerAll } from '../src/index.js';
    import {
      route as defineRoute, go as navTo, start as startRouter, RouterError,
    } from '../src/index.js';
    import { addMessages, setLocale, t as i18nT } from '../src/index.js';
    registerAll();

    // dialog
    const dlg = document.getElementById('dlg');
    document.getElementById('open-dialog').addEventListener('click', () => dlg.open());
    document.getElementById('dlg-cancel').addEventListener('click', () => dlg.close('cancel'));
    document.getElementById('dlg-ok').addEventListener('click', () => dlg.close('ok'));

    // action-sheet
    const sheet = document.getElementById('sheet');
    sheet.options = [
      { label: '微信', value: 'wechat' },
      { label: '微博', value: 'weibo' },
      { label: '复制链接', value: 'copy' },
    ];
    document.getElementById('open-sheet').addEventListener('click', () => sheet.showPopover());

    // dropdown
    const dd = document.getElementById('dd');
    dd.options = [
      { label: '北京', value: 'bj' },
      { label: '上海', value: 'sh' },
      { label: '广州', value: 'gz' },
    ];

    // picker
    const picker = document.getElementById('picker');
    picker.columns = [
      [
        { label: '2020', value: 2020 },
        { label: '2021', value: 2021 },
        { label: '2022', value: 2022 },
        { label: '2023', value: 2023 },
        { label: '2024', value: 2024 },
        { label: '2025', value: 2025 },
        { label: '2026', value: 2026 },
      ],
      [
        { label: '1月', value: 1 },
        { label: '2月', value: 2 },
        { label: '3月', value: 3 },
      ],
    ];
    picker.values = [2025, 2];
    document.getElementById('open-picker').addEventListener('click', () => picker.open());

    // swiper 索引回显
    const swp = document.getElementById('swp');
    const idxLabel = document.getElementById('swiper-index');
    swp.addEventListener('af-swiper:change', (e) => {
      idxLabel.textContent = '当前索引：' + e.detail.index;
    });

    // router：query / scrollBehavior / outlet 抛错（e2e 用 transition:false 保证确定性）
    defineRoute('/', (p, ctx) => { ctx.outlet.innerHTML = '<div>home</div>'; });
    defineRoute('/list', (p, ctx) => {
      ctx.outlet.innerHTML = `<div>list page ${p.page}</div>`;
      document.getElementById('router-query-out').textContent = 'page=' + p.page;
    });
    defineRoute('/el', (p, ctx) => {
      ctx.outlet.innerHTML = '<div style="height:2000px;">长页面<div id="scroll-target" style="margin-top:1800px;">target</div></div>';
    });
    defineRoute('/bad', (p, ctx) => {
      ctx.outlet.innerHTML = '<main></main>';
      return 'main[data-router-outlet]';   // 该选择器不存在 → 抛 RouterError
    });
    startRouter({
      outlet: '#router-app',
      scrollBehavior: (to) => to.path === '/el' ? { el: '#scroll-target' } : { x: 0, y: 0 },
    });
    document.getElementById('router-go-query').addEventListener('click', () => navTo('/list?page=2', { transition: false }));
    document.getElementById('router-go-el').addEventListener('click', () => navTo('/el', { transition: false }));
    document.getElementById('router-go-bad').addEventListener('click', () => {
      navTo('/bad', { transition: false }).catch(e => {
        document.getElementById('router-error-out').textContent = e instanceof RouterError ? e.name : 'unknown';
      });
    });
    window.__routerGo = (path) => navTo(path, { transition: false });   // 测试用：暴露解析后的 promise

    // i18n 复数：en（两形式）+ ar（六形式）
    addMessages('en-US', { 'e2e.items': { one: '{n} item', other: '{n} items' } });
    addMessages('ar-SA', {
      'e2e.items': {
        zero: 'لا عناصر', one: 'عنصر واحد', two: 'عنصران',
        few: '{n} عناصر', many: '{n} عنصرًا', other: '{n} عنصر',
      },
    });
    const pluralOut = document.getElementById('i18n-plural-out');
    const renderPlural = () => {
      pluralOut.textContent = [0, 1, 2, 3, 11, 100].map(n => `${n}:${i18nT('e2e.items', { n })}`).join(' | ');
    };
    document.getElementById('i18n-en').addEventListener('click', () => { setLocale('en-US'); renderPlural(); });
    document.getElementById('i18n-ar').addEventListener('click', () => { setLocale('ar-SA'); renderPlural(); });
    renderPlural();

    // 标记组件已就绪（playwright 等待此属性）
    window.__ready = true;
  </script>
</body>
</html>
