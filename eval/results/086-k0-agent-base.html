<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 客服</title>
  <link rel="stylesheet" href="../../src/index.css">
  <style>
    html, body { height: 100%; }
    .page { height: 100dvh; display: flex; flex-direction: column; }
    .page af-chat { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div class="page p-0">
    <header class="navbar">
      <h1 class="title">AI 客服</h1>
    </header>

    <af-chat id="chat" placeholder="请输入您的问题"></af-chat>
  </div>

  <script type="module">
    import { registerChat, createMessage } from '../../src/chat/index.js';
    registerChat();

    const chat = document.getElementById('chat');
    chat.messages = [
      createMessage({ role: 'assistant', content: [{ type: 'text', text: '您好，我是 AI 客服小助手，请问有什么可以帮您？' }] })
    ];

    chat.addEventListener('af-chat:send', (e) => {
      chat.messages = [...chat.messages, createMessage({
        role: 'user',
        content: [{ type: 'text', text: e.detail.text }]
      })];
      setTimeout(() => {
        chat.messages = [...chat.messages, createMessage({
          role: 'assistant',
          content: [{ type: 'text', text: '已收到您的问题「' + e.detail.text + '」，人工客服正在接入，请稍候。' }]
        })];
      }, 500);
    });
  </script>
</body>
</html>
