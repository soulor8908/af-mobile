<!doctype html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">消息</nav>
  <af-list id="list" item-height="64" refresh></af-list>
</div>
<script type="module">
import { signal, effect, fetchPage } from '/af-mobile.js';
const list = document.getElementById('list');
const items = signal([]);
effect(() => { list.data = items(); });
list.renderItem = (item) => `
  <af-swipe-cell>
    <div slot="content" class="list-item g-3 aic">
      <img class="avatar" src="${item.avatar}" alt="">
      <div class="flex-1 fc">
        <div class="jcsb aic">
          <span class="title t-lg">${item.title}</span>
          <span class="meta text-muted">${item.meta}</span>
        </div>
      </div>
    </div>
    <div slot="right" class="flex-1 fc">
      <button class="btn btn-danger" data-action="delete">删除</button>
    </div>
  </af-swipe-cell>
`;
list.addEventListener('af-swipe-cell:action', (e) => {
  if (e.detail.action === 'delete') {
    const index = items().findIndex(i => i.id === e.detail.item.id);
    items().splice(index, 1);
  }
});
list.addEventListener('af-list:refresh', async () => {
  items.set(await fetchPage('/api/messages'));
  list.endRefresh();
});
items.set(await fetchPage('/api/messages'));
</script>
</body>
</html>
