name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changeset status 需对比 baseBranch（main）的完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 固定 npm 版本（与本地开发 Node 24.14 / npm 11.9.0 对齐）。
      # 根包 overrides("@af-mobile/ui":"file:.") 依赖 npm 11 的解析行为：
      #  - Node 20 自带的 npm 10 会忽略该 override → create-af-mobile 的 ^1.7.0 去注册表解析 → ETARGET（1.7.0 尚未发布）
      #  - 较旧 npm 11 小版本重写 adapters 的 peer ^1.4.0 时又报 ERESOLVE
      # 11.9.0 经本地验证可同时正确处理，故在此锁定，避免 runner 自带 npm 的版本漂移。
      - name: Pin npm version
        run: npm install -g npm@11.9.0

      - run: npm ci

      # Step 0: changesets 闸门（仅 PR）—— 有包改动但缺 changeset 时阻断，需先 `npm run changeset`
      - name: Changesets check (PR only)
        if: github.event_name == 'pull_request'
        run: npm run changeset:check

      # Step 1: 白名单三源同步检查（A 源码 ↔ B whitelist-v1.json ↔ C Prompt 注入）
      - name: Whitelist sync (3-source diff)
        run: npm run whitelist:check

      # Step 1b: d.ts 与源码组件数同步检查（防手工类型声明漂移）
      - name: Types sync (d.ts ↔ src)
        run: npm run types:check

      # Step 1c: 提交态 prompt 快照 vs 运行时构建一致性（防 prompt 过期）
      - name: Prompt sync (committed ↔ runtime)
        run: npm run prompt:check

      # Step 1d: ARIA 要求同步（JSON 声明 ↔ 规则 JS 检测分支，docs/incidents.md #5）
      - name: ARIA sync (requirements ↔ rule)
        run: npm run aria:check

      # Step 1e: skill 文档代码块可执行性（import 导出名 / register 标签 ↔ 当前包，防 API 漂移）
      - name: Skill docs API drift check
        run: npm run skill:check

      # Step 1f: i18n key 注册校验（引用 key 已注册 + zh-CN ↔ en-US 字典对齐）
      - name: i18n sync (refs ↔ dictionaries)
        run: npm run i18n:check

      # Step 1g: tokens 双源同步（tokens.json ↔ tokens.css）
      - name: Tokens sync (json ↔ css)
        run: npm run tokens:check

      # Step 1h: 入口生成幂等校验（src/index.js ↔ src/components/，防新组件漏注册导出）
      - name: Entry sync (index.js ↔ components)
        run: npm run entry:check

      # Step 2: 体积检查（L1+L2 CSS + L3 JS）
      - name: Size budget check
        run: npm run size

      # Step 3: 测试（vitest）
      - name: Test
        run: npm test

      # Step 3b: e2e smoke（Playwright）
      # 验证 jsdom 覆盖不到的浏览器原生 API 真实行为：showModal/popover/scroll-snap/touch
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: e2e smoke (Playwright)
        timeout-minutes: 5
        run: npm run test:e2e

      # Step 3c: 性能基线已移至 .github/workflows/perf.yml（定时任务）
      # Lighthouse 在共享 runner 上耗时长且结果受负载影响，不适合作为 PR 阻断闸门

      # Step 4: ESLint 规则闸门（消费端 AI_RULES 24 条 / 库源码 COMPONENT_RULES，分目录生效）—— error 级直接阻断 PR
      # 范围覆盖全部含 JS 的目录（含 e2e spec / prompt CLI / eslint-plugin-af-mobile 工作区与 .mjs，docs/incidents.md #9）
      - name: ESLint check
        run: npx eslint src/ test/ scripts/ e2e/ prompt/ eval/ mcp/ eslint-plugin-af-mobile/ adapters/ starter/src/ --max-warnings 0

      # Step 4b: 数据飞轮采集 + 分析 + 报告 artifact（不阻断；lint 闸门已由上一步保证）
      # demo/ 不在 ESLint 闸门范围内，是真实违规信号来源；闸门目录贡献干净运行记录。
      # 遥测在 runner 本地生成（消息已脱敏，无代码内容），分析报告上传 artifact 供人工 review。
      - name: Flywheel harvest (lint + telemetry)
        continue-on-error: true
        run: node scripts/lint-flywheel.mjs demo/ src/ test/ scripts/ eval/ mcp/ --record-clean || true
      - name: Flywheel analyze (report)
        if: always()
        continue-on-error: true
        run: node eval/flywheel.mjs --out flywheel-report.md || true
      - name: Upload flywheel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flywheel-report
          path: flywheel-report.md
          if-no-files-found: ignore
          retention-days: 30

      # Step 5: 发布前检查（build dist + Tree Shaking + sideEffects + npm pack 内容）
      # PR 阶段跑以提前发现发布问题；正式发布由 prepublishOnly 二次保证
      - name: Build dist
        run: npm run build
      - name: Publish check (tree-shaking + sideEffects)
        run: npm run publish:check

      # Step 6: eval 集格式闸门（零 token 成本，仅校验 prompts.jsonl 结构）
      # 防止评测集静默损坏（缺字段/JSON 语法错误）
      - name: Eval prompts format check
        run: npm run eval:dry

# Step 6: CODEOWNERS 审批由 GitHub Branch Protection Rules 自动处理
# 配置：Settings → Branches → Branch protection rules → Require review from Code Owners
# 关键文件 → Owner 映射见 .github/CODEOWNERS
