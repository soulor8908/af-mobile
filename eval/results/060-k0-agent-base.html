<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>地址选择表单</title>
  <link rel="stylesheet" href="../../src/index.css">
</head>
<body>
  <div class="page">
    <header class="navbar">
      <h1 class="title">新增收货地址</h1>
    </header>

    <div class="cell m-3" id="region-btn" role="button" tabindex="0" aria-haspopup="dialog">
      <span class="label">所在地区</span>
      <span class="flex-1 t-right meta" id="region-text">请选择省 / 市 / 区</span>
    </div>

    <button class="btn btn-block m-3" id="save-btn" type="button">保存地址</button>

    <p class="caption t-center p-3">点击「所在地区」从滚轮选择器中三级联动选择</p>

    <af-picker id="picker"></af-picker>
  </div>

  <script type="module">
    import { register } from '../../src/index.js';
    await register('af-picker');

    const REGIONS = {
      '广东省': { '深圳市': ['南山区', '福田区', '罗湖区'], '广州市': ['天河区', '越秀区', '海珠区'] },
      '浙江省': { '杭州市': ['西湖区', '滨江区', '余杭区'], '宁波市': ['海曙区', '江北区', '鄞州区'] },
      '四川省': { '成都市': ['锦江区', '青羊区', '武侯区'], '绵阳市': ['涪城区', '游仙区', '安州区'] }
    };
    const provs = Object.keys(REGIONS);
    const citiesOf = (p) => Object.keys(REGIONS[p]);
    const areasOf = (p, c) => REGIONS[p][c] || [];

    const picker = document.getElementById('picker');
    const regionBtn = document.getElementById('region-btn');
    const regionText = document.getElementById('region-text');
    const saveBtn = document.getElementById('save-btn');

    picker.title = '选择所在地区';
    picker.confirmText = '确认';
    picker.cancelText = '取消';
    picker.columns = [provs, citiesOf(provs[0]), areasOf(provs[0], citiesOf(provs[0])[0])];
    picker.values = [provs[0], citiesOf(provs[0])[0], areasOf(provs[0], citiesOf(provs[0])[0])[0]];

    picker.addEventListener('af-picker:change', (e) => {
      const [p, c] = picker.values;
      if (e.detail.column === 0) {
        const cs = citiesOf(p);
        picker.setColumn(1, cs, cs[0]);
        picker.setColumn(2, areasOf(p, cs[0]), areasOf(p, cs[0])[0]);
      } else if (e.detail.column === 1) {
        picker.setColumn(2, areasOf(p, c), areasOf(p, c)[0]);
      }
    });

    picker.addEventListener('af-picker:confirm', () => {
      regionText.textContent = picker.values.join(' / ');
    });

    regionBtn.addEventListener('click', () => picker.open());
    regionBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.open(); }
    });

    saveBtn.addEventListener('click', () => {
      saveBtn.textContent = regionText.textContent === '请选择省 / 市 / 区'
        ? '请先选择所在地区'
        : '已保存：' + regionText.textContent;
    });
  </script>
</body>
</html>
