<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <af-navbar title="周报"></af-navbar>
  <div class="p-3">
    <div class="card">
      <div class="p-4">
        <div class="subtitle m-2">本周销量统计</div>
        <af-chart-bar id="salesChart"></af-chart-bar>
      </div>
    </div>
    <div class="card m-3">
      <div class="p-4">
        <div class="subtitle m-2">本周访问量趋势</div>
        <af-chart-line id="visitsChart" variant="area"></af-chart-line>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { registerChart } from '/af-mobile/charts/index.js';
await registerChart('af-chart-bar');
await registerChart('af-chart-line');

const salesData = {
  labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
  series: [{
    name: '销量',
    data: [120, 150, 180, 200, 220, 190, 160]
  }]
};

const visitsData = {
  labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
  series: [{
    name: '访问量',
    data: [800, 950, 1100, 1250, 1400, 1300, 1150]
  }]
};

document.getElementById('salesChart').data = salesData;
document.getElementById('visitsChart').data = visitsData;
</script>
</body>
</html>
