<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">资讯</nav>
  <af-pull-refresh id="pr">

      </div>
      <div class="list-item f aic g-3">
        <div class="flex-1 fc g-1">
          <div class="body t-b ellipsis-2">2024年全球开发者大会将于下月举行，AI成核心议题</div>

        <img class="thumb" src="https://picsum.photos/seed/news2/72/72" alt="">
      </div>
      <div class="list-item f aic g-3">
        <div class="flex-1 fc g-1">
          <div class="body t-b ellipsis-2">新能源汽车市场渗透率突破50%，燃油车时代加速落幕</div>

        <img class="thumb" src="https://picsum.photos/seed/news3/72/72" alt="">

        </div>
        <img class="thumb" src="https://picsum.photos/seed/news4/72/72" alt="">
      </div>
      <div class="list-item f aic g-3">
        <div class="flex-1 fc g-1">
          <div class="body t-b ellipsis-2">OpenAI 发布全新模型推理能力大幅提升，引发行业热议</div>

      </div>
    </div>
  </af-pull-refresh>
</div>
<script type="module">
import { register } from '/af-mobile.js';
await register();
const pr = document.getElementById('pr');
pr.addEventListener('af-pull-refresh:refresh', async () => {
  pr.refreshing = true;
  setTimeout(() => {
    pr.refreshing = false;
  }, 2000);
});
</script>
</body>
</html>
