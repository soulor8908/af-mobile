<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
  <div class="page">
    <nav class="navbar">购物车</nav>
    <div class="list">
      <div class="list-item">
        <div class="f aic g-2">
          <input class="checkbox" type="checkbox">
          <img class="thumb" src="" alt="" width="56" height="56">
          <div class="fc flex-1 g-1">
            <span class="title">纯棉卫衣</span>
            <span class="caption text-muted">颜色：黑色 / 尺码：L</span>
            <div class="f jcsb aic g-2">
              <span class="price">¥199.00</span>
              <div class="f aic g-2">
                <button class="btn btn-sm btn-ghost" type="button">-</button>
                <span class="t-md">1</span>
                <button class="btn btn-sm btn-ghost" type="button">+</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="checkout-bar">
      <span class="price">合计：¥199.00</span>
      <button class="btn btn-block" type="button">结算</button>
    </div>
  </div>
