<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>af-rate demo - aiflow-ui</title>
  <link rel="stylesheet" href="../../src/index.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow"><a href="../index.html" class="subtitle">← 返回</a></p>
      <h1 class="display">af-rate 评分</h1>
    </section>

    <div class="card">
      <div class="cell"><span class="body">默认</span><af-rate id="r1" value="3"></af-rate></div>
      <div class="cell"><span class="body">只读</span><af-rate value="4" readonly></af-rate></div>
      <div class="cell"><span class="body">大号</span><af-rate value="2" size="lg"></af-rate></div>
      <div class="cell"><span class="body">10 星</span><af-rate value="7" max="10"></af-rate></div>
    </div>

    <p class="caption" id="log">点击星星评分 · 键盘原生支持</p>

    <section id="props" class="card"></section>
  </main>

  <script type="module">
    import { AfRate } from '../../src/components/af-rate.js';
    customElements.define('af-rate', AfRate);
    import { createPropsPanel } from '../props-panel.js';

    const r1 = document.getElementById('r1');
    r1.addEventListener('af-rate:change', (e) => {
      document.getElementById('log').textContent = `评分 ${e.detail.value}`;
    });

    createPropsPanel(document.getElementById('props'), [
      { prop: 'value', label: '值', type: 'number', min: 0, max: 10, step: 1 },
      { prop: 'max', label: '上限', type: 'number', min: 1, max: 10, step: 1 },
      { prop: 'readonly', label: '只读', type: 'boolean' },
      { prop: 'size', label: '尺寸', type: 'select', options: ['sm', 'md', 'lg'] },
    ], r1);
  </script>
</body>
</html>
