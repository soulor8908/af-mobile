<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page center p-4">
  <button id="triggerBtn" class="btn">分享</button>
</div>

<dialog class="sheet">
  <div class="p-4">
    <div class="grid g-3 py-4" style="grid-template-columns: repeat(4, 1fr)">
      <div class="fc aic g-1" data-type="wechat">
        <div class="icon-badge bg-success text-onbrand">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a8 8 0 0 1-8 8H5l1.6-2.4A8 8 0 1 1 21 12z"/></svg>
        </div>
        <span class="caption">微信</span>
      </div>
      <div class="fc aic g-1" data-type="moments">
        <div class="icon-badge bg-brand text-onbrand">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <span class="caption">朋友圈</span>
      </div>
      <div class="fc aic g-1" data-type="link">
        <div class="icon-badge bg-muted text-gray-7">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <span class="caption">复制链接</span>
      </div>
      <div class="fc aic g-1" data-type="poster">
        <div class="icon-badge bg-brand text-onbrand">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <span class="caption">生成海报</span>
      </div>
    </div>
    <button id="cancelBtn" class="btn btn-block">取消</button>
  </div>
</dialog>

<script type="module">
import { register } from '/af-mobile.js';
await register('af-toast');

const sheet = document.querySelector('.sheet');
const triggerBtn = document.getElementById('triggerBtn');
const cancelBtn = document.getElementById('cancelBtn');
const shareItems = document.querySelectorAll('.fc[data-type]');

triggerBtn.addEventListener('click', () => {
  sheet.showModal();
});

cancelBtn.addEventListener('click', () => {
  sheet.close();
});

// 点击遮罩层关闭
sheet.addEventListener('click', (e) => {
  if (e.target === sheet) {
    sheet.close();
  }
});

shareItems.forEach(item => {
  item.addEventListener('click', () => {
    const type = item.dataset.type;
    const toast = document.createElement('af-toast');
    document.body.appendChild(toast);
    
    let msg = '';
    switch(type) {
      case 'wechat': msg = '已调起微信'; break;
      case 'moments': msg = '已调起朋友圈'; break;
      case 'link': msg = '链接已复制'; break;
      case 'poster': msg = '正在生成海报...'; break;
    }
    
    toast.textContent = msg;
    toast.show();
    sheet.close();
  });
});
</script>
</body>
</html>
