<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
  <div class="page">
    <nav class="navbar">订单列表</nav>
    <af-list id="orderList" item-height="128"></af-list>
  </div>

  <script type="module">
    import { signal, effect } from '/af-mobile.js';

    const list = document.getElementById('orderList');

    const rawItems = [
      { orderNo: 'SO20250112001', createdAt: '2025-01-12 14:20', status: 'pending', amount: '299.00' },
      { orderNo: 'SO20250111002', createdAt: '2025-01-11 09:35', status: 'shipped', amount: '1580.00' },
      { orderNo: 'SO20250110003', createdAt: '2025-01-10 20:11', status: 'completed', amount: '89.90' },
      { orderNo: 'SO20250109004', createdAt: '2025-01-09 08:02', status: 'pending', amount: '45.50' },
      { orderNo: 'SO20250108005', createdAt: '2025-01-08 16:48', status: 'completed', amount: '1200.00' }
    ];

    const statusMap = {
      pending: { text: '待付款', cls: 'tag tag-warn', html: '<span class="tag tag-warn">待付款</span>' },
      shipped: { text: '已发货', cls: 'tag', html: '<span class="tag">已发货</span>' },
      completed: { text: '已完成', cls: 'tag tag-ok', html: '<span class="tag tag-ok">已完成</span>' }
    };

    const items = signal(rawItems.map(item => ({
      ...item,
      statusText: statusMap[item.status].text,
      statusClass: statusMap[item.status].cls
    })));

    list.renderItem = (item) => `
      <div class="list-item">
        <div class="fc w-full g-2">
          <div class="f jcsb aic g-2">
            <span class="body t-b flex-1 ws-nowrap">订单号：${item.orderNo}</span>
            ${statusMap[item.status].html}
          </div>
          <span class="caption text-muted">下单时间：${item.createdAt}</span>
          <div class="f jcsb aic g-2">
            <span class="price flex-1">¥${item.amount}</span>
            <button class="btn btn-sm btn-ghost" type="button">查看详情</button>
          </div>
        </div>
      </div>
    `;

    effect(() => {
      list.data = items();
    });
  </script>
</body>
</html>
