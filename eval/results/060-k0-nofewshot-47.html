<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">地址选择</nav>
  
  <div class="card m-3">
    <div class="fc g-3 p-4">
      <div class="form-row">
        <label class="label">所在地区</label>
        <input id="regionInput" class="input" readonly placeholder="请选择省/市/区" />
      </div>
      
      <button id="submitBtn" class="btn btn-block">确认</button>
    </div>
  </div>

  <af-picker id="picker" title="选择地区"></af-picker>
</div>

<script type="module">
import { register } from '/af-mobile.js';
await register();

// 模拟省市区数据
const addressData = {
  '浙江省': {
    '杭州市': ['西湖区', '上城区', '拱墅区', '滨江区'],
    '宁波市': ['海曙区', '江北区', '鄞州区', '奉化区'],
    '温州市': ['鹿城区', '龙湾区', '瓯海区', '洞头区']
  },
  '广东省': {
    '广州市': ['天河区', '越秀区', '海珠区', '荔湾区'],
    '深圳市': ['南山区', '福田区', '罗湖区', '宝安区'],
    '珠海市': ['香洲区', '斗门区', '金湾区']
  },
  '江苏省': {
    '南京市': ['玄武区', '秦淮区', '建邺区', '鼓楼区'],
    '苏州市': ['虎丘区', '吴中区', '相城区', '姑苏区'],
    '无锡市': ['锡山区', '惠山区', '滨湖区', '梁溪区']
  }
};

const picker = document.getElementById('picker');
const input = document.getElementById('regionInput');
const submitBtn = document.getElementById('submitBtn');

// 初始化列数据
const provinces = Object.keys(addressData);
picker.columns = [provinces, [], []];

// 初始化默认选中项（第一省第一市第一区）
const initProv = provinces[0];
const initCities = Object.keys(addressData[initProv]);
const initCity = initCities[0];
const initDistricts = addressData[initProv][initCity];

picker.setColumn(1, initCities);
picker.setColumn(2, initDistricts);
picker.values = [initProv, initCity, initDistricts[0]];

// 点击输入框唤起选择器
input.addEventListener('click', () => {
  picker.open();
});

// 监听选择器变化，实现省市区三级联动
picker.addEventListener('af-picker:change', (e) => {
  const { index, value } = e.detail;
  const currentValues = picker.values || [];

  if (index === 0) {
    // 省份变化 -> 重置城市和区县
    const cities = Object.keys(addressData[value]);
    picker.setColumn(1, cities);
    if (cities.length > 0) {
      const districts = addressData[value][cities[0]];
      picker.setColumn(2, districts);
    } else {
      picker.setColumn(2, []);
    }
  } else if (index === 1) {
    // 城市变化 -> 重置区县
    const prov = currentValues[0];
    if (prov && addressData[prov] && addressData[prov][value]) {
      picker.setColumn(2, addressData[prov][value]);
    }
  }
});

// 监听确认事件，回填数据
picker.addEventListener('af-picker:confirm', (e) => {
  const [p, c, d] = e.detail.values;
  input.value = `${p} ${c} ${d}`;
});

// 表单提交
submitBtn.addEventListener('click', () => {
  if (!input.value) {
    alert('请选择地区');
    return;
  }
  console.log('提交地址:', input.value);
  alert(`已选择：${input.value}`);
});
</script>
</body>
</html>
