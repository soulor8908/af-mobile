<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>af-picker demo - af-mobile</title>
  <link rel="stylesheet" href="../../src/index.css">
  <!-- 主题防闪：先于组件挂载恢复 localStorage 主题 -->
  <script>try{var saved=localStorage.getItem('theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch(e){}</script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow"><a href="../index.html" class="subtitle">← 返回</a></p>
      <h1 class="display">af-picker 滚轮选择器</h1>
    </section>

    <div class="actions">
      <button class="btn" id="open">打开选择器</button>
      <button class="btn btn-ghost" id="close">close() 关闭</button>
    </div>

    <af-picker id="picker" title="选择日期"></af-picker>

    <p class="caption" id="log">确认后显示选中值</p>

    <section id="props" class="card"></section>
  </main>

  <script type="module">
    import { AfPicker } from '../../src/components/af-picker.js';
    customElements.define('af-picker', AfPicker);
    import { createPropsPanel } from '../props-panel.js';

    const picker = document.getElementById('picker');
    // 列项两种格式：string 或 { label, value } 对象（confirm 载荷返回 value）
    picker.columns = [
      ['2024', '2025', '2026'],
      [{ label: '1月', value: 'Jan' }, { label: '2月', value: 'Feb' }, { label: '3月', value: 'Mar' }],
      ['1日', '15日', '28日'],
    ];
    picker.values = ['2025', 'Jan', '1日'];

    document.getElementById('open').addEventListener('click', () => picker.open());
    document.getElementById('close').addEventListener('click', () => picker.close());
    picker.addEventListener('af-picker:confirm', (e) => {
      document.getElementById('log').textContent = `确认: ${e.detail.values?.join(' / ')}`;
    });
    picker.addEventListener('af-picker:cancel', () => {
      document.getElementById('log').textContent = '已取消';
    });
    picker.addEventListener('af-picker:change', (e) => {
      // change 载荷：{ column, value, index }（注意与 confirm 的 { values } 不同）
      document.getElementById('log').textContent = `变化: 第${e.detail.column}列 → ${e.detail.value} (index=${e.detail.index})`;
    });

    createPropsPanel(document.getElementById('props'), [
      { prop: 'title', label: '标题', type: 'string' },
    ], picker);
  </script>
</body>
</html>
