<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新增收货地址</title>
<link rel="stylesheet" href="../../src/index.css">
</head>
<body>
<div class="page">
  <header class="navbar">
    <button class="btn btn-ghost btn-sm" aria-label="返回">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 4-8 8 8 8"/></svg>
    </button>
    <h1 class="title flex-1 t-center">新增收货地址</h1>
    <span class="btn-sm shrink-0"></span>
  </header>

  <form id="addrForm" class="fc g-3 p-3">
    <div class="form-row">
      <label class="label" for="name">收件人</label>
      <input class="input" id="name" name="name" required placeholder="请输入收件人姓名">
    </div>
    <div class="form-row">
      <label class="label" for="phone">手机号</label>
      <input class="input" id="phone" name="phone" type="tel" required pattern="1\d{10}" placeholder="请输入 11 位手机号">
    </div>
    <div class="form-row">
      <label class="label" for="regionBtn">所在地区</label>
      <button type="button" class="input t-left" id="regionBtn" aria-haspopup="dialog">请选择省 / 市 / 区</button>
    </div>
    <div class="form-row">
      <label class="label" for="detail">详细地址</label>
      <textarea class="input" id="detail" name="detail" rows="3" placeholder="街道、门牌号、小区楼栋等"></textarea>
    </div>
    <button class="btn btn-block" type="submit">确认</button>
    <p class="caption text-muted t-center" id="saveTip" role="status"></p>
  </form>

  <af-picker id="regionPicker" title="选择省市区"></af-picker>
</div>

<script type="module">
import { register } from '../../src/index.js';
register('af-picker');

const REGION = {
  广东省: { 广州市: ['天河区', '越秀区', '海珠区'], 深圳市: ['南山区', '福田区', '宝安区'] },
  浙江省: { 杭州市: ['西湖区', '拱墅区', '滨江区'], 宁波市: ['海曙区', '江北区', '鄞州区'] },
  江苏省: { 南京市: ['玄武区', '秦淮区', '鼓楼区'], 苏州市: ['姑苏区', '虎丘区', '吴中区'] },
};
const citiesOf = (p) => Object.keys(REGION[p] || {});
const areasOf = (p, c) => (REGION[p] || {})[c] || [];

const picker = document.getElementById('regionPicker');
const regionBtn = document.getElementById('regionBtn');
const saveTip = document.getElementById('saveTip');
const provinces = Object.keys(REGION);
const firstProvince = provinces[0];
const firstCity = citiesOf(firstProvince)[0];

picker.columns = [provinces, citiesOf(firstProvince), areasOf(firstProvince, firstCity)];
picker.values = [firstProvince, firstCity, areasOf(firstProvince, firstCity)[0]];

let curProvince = firstProvince;
picker.addEventListener('af-picker:change', (e) => {
  if (e.detail.column === 0) {
    curProvince = e.detail.value;
    const cities = citiesOf(curProvince);
    picker.setColumn(1, cities, cities[0]);
    picker.setColumn(2, areasOf(curProvince, cities[0]), areasOf(curProvince, cities[0])[0]);
  } else if (e.detail.column === 1) {
    const areas = areasOf(curProvince, e.detail.value);
    picker.setColumn(2, areas, areas[0]);
  }
});

picker.addEventListener('af-picker:confirm', (e) => {
  const values = e.detail.values || [];
  regionBtn.textContent = values.join(' ');
  saveTip.textContent = '';
});

regionBtn.addEventListener('click', () => picker.open());

document.getElementById('addrForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target;
  if (!form.checkValidity()) { form.reportValidity(); return; }
  if (regionBtn.textContent === '请选择省 / 市 / 区') {
    saveTip.textContent = '请先选择所在地区';
    return;
  }
  saveTip.textContent = '地址已保存：' + form.elements.name.value + ' · ' + regionBtn.textContent;
});
</script>
</body>
</html>
