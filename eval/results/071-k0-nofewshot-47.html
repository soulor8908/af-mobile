<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <nav class="navbar">商品评价</nav>
  <div class="card p-3 m-3">
    <form id="reviewForm">
      <div class="form-row">
        <label class="label">评分</label>
        <af-rate id="rate" value="5" max="5"></af-rate>
      </div>
      <div class="form-row">
        <label class="label">评价内容</label>
        <textarea class="textarea" name="content" placeholder="分享您的使用体验，帮助更多人了解商品" rows="5"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-block" type="submit">提交评价</button>
      </div>
    </form>
  </div>
</div>
<script type="module">
import { fetchPage, back } from '/af-mobile.js';

const form = document.getElementById('reviewForm');
const rateComponent = document.getElementById('rate');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  // 获取评分值
  const score = rateComponent.value;
  
  // 获取表单数据
  const formData = new FormData(form);
  const content = formData.get('content');

  if (!content || content.trim().length === 0) {
    // 简单校验，实际项目可用 af-toast 提示
    alert('请输入评价内容');
    return;
  }

  // 模拟提交
  console.log('提交评分:', score, '内容:', content);
  
  // await fetchPage('/api/review', { method: 'POST', body: JSON.stringify({ score, content }) });
  
  // 提交成功返回
  back();
});
</script>
</body>
</html>
