<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>操作确认弹窗</title>
<link rel="stylesheet" href="../../src/index.css">
</head>
<body>
<div class="page">
  <header class="navbar">
    <button class="btn btn-ghost btn-sm" aria-label="返回">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 4-8 8 8 8"/></svg>
    </button>
    <h1 class="title flex-1 t-center">消息</h1>
    <span class="btn-sm shrink-0"></span>
  </header>

  <div class="list">
    <div class="list-item g-3">
      <img class="avatar" src="https://placehold.co/72x72" alt="">
      <div class="flex-1 min-w-0 fc g-1">
        <div class="f aic jcsb">
          <span class="body t-b">云上书店</span>
          <span class="meta text-muted">14:20</span>
        </div>
        <span class="caption text-muted ellipsis">您收藏的《设计心理学》降价啦，快来看看</span>
      </div>
      <button class="btn btn-ghost btn-sm" data-del aria-label="删除该消息">删除</button>
    </div>
    <div class="list-item g-3">
      <img class="avatar" src="https://placehold.co/72x72" alt="">
      <div class="flex-1 min-w-0 fc g-1">
        <div class="f aic jcsb">
          <span class="body t-b">快递助手</span>
          <span class="meta text-muted">12:05</span>
        </div>
        <span class="caption text-muted ellipsis">您的包裹已签收，感谢使用，期待再次光临</span>
      </div>
      <button class="btn btn-ghost btn-sm" data-del aria-label="删除该消息">删除</button>
    </div>
    <div class="list-item g-3">
      <img class="avatar" src="https://placehold.co/72x72" alt="">
      <div class="flex-1 min-w-0 fc g-1">
        <div class="f aic jcsb">
          <span class="body t-b">会员中心</span>
          <span class="meta text-muted">昨天</span>
        </div>
        <span class="caption text-muted ellipsis">您有 260 积分即将过期，尽快去积分商城使用</span>
      </div>
      <button class="btn btn-ghost btn-sm" data-del aria-label="删除该消息">删除</button>
    </div>
  </div>

  <p class="caption text-muted p-3 t-center" id="tip" role="status" aria-live="polite"></p>

  <af-dialog id="delDialog" title="删除确认" open>
    <div slot="body">
      <p class="body">确定要删除这条消息吗？删除后将无法恢复。</p>
    </div>
    <div slot="footer">
      <button class="btn btn-ghost btn-block" data-act="cancel">取消</button>
      <button class="btn btn-block" data-act="confirm">确认删除</button>
    </div>
  </af-dialog>
</div>

<script type="module">
import { register } from '../../src/index.js';
await register('af-dialog');

const dialog = document.getElementById('delDialog');
const tip = document.getElementById('tip');
dialog.open(); // 页面加载即打开，呈现操作确认场景

document.querySelectorAll('[data-del]').forEach((btn) => {
  btn.addEventListener('click', () => dialog.open());
});
dialog.addEventListener('af-dialog:close', (e) => {
  tip.textContent = e.detail && e.detail.action === 'confirm' ? '已删除该消息（演示）' : '已取消删除';
});
</script>
</body>
</html>
