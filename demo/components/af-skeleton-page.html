<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>af-skeleton-page demo - af-mobile</title>
  <link rel="stylesheet" href="../../src/index.css">
  <!-- 主题防闪：先于组件挂载恢复 localStorage 主题 -->
  <script>try{var saved=localStorage.getItem('theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch(e){}</script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow"><a href="../index.html" class="subtitle">← 返回</a></p>
      <h1 class="display">af-skeleton-page 骨架屏</h1>
    </section>

    <af-skeleton-page id="sk" variant="list"></af-skeleton-page>

    <p class="caption" id="log">骨架屏为纯展示态，切换变体即重新渲染</p>

    <div class="actions">
      <button class="btn" id="reload">切换下一个布局变体</button>
    </div>

    <section id="props" class="card"></section>
  </main>

  <script type="module">
    import { AfSkeletonPage } from '../../src/components/af-skeleton-page.js';
    customElements.define('af-skeleton-page', AfSkeletonPage);
    import { createPropsPanel } from '../props-panel.js';

    const sk = document.getElementById('sk');
    const VARIANTS = ['list', 'card', 'profile', 'article'];
    document.getElementById('reload').addEventListener('click', () => {
      // 骨架屏是纯展示态，无 loading 属性：重新加载即切换 variant 触发重渲染
      const next = VARIANTS[(VARIANTS.indexOf(sk.variant) + 1) % VARIANTS.length];
      sk.variant = next;
      document.getElementById('log').textContent = `已切换变体：${next}`;
    });

    createPropsPanel(document.getElementById('props'), [
      { prop: 'variant', label: '变体', type: 'select', options: ['list', 'card', 'profile', 'article'] },
    ], sk);
  </script>
</body>
</html>
