<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page">
  <header class="navbar navbar-fixed">
    <span class="title">销量分析</span>
  </header>
  <div class="p-4 fc g-4">
    <div class="card p-4">
      <af-chart-bar id="salesChart" legend height="240"></af-chart-bar>
    </div>
    <div>
      <div class="section-tt m-0">品类明细</div>
      <div class="list" id="categoryList"></div>
    </div>
  </div>
</div>
<script type="module">
import { registerChart } from '/af-mobile/charts/index.js';

await registerChart('af-chart-bar');

const chart = document.getElementById('salesChart');
chart.labels = ['手机', '电脑', '平板', '耳机', '配件'];
chart.series = [{ name: '销量', values: [120, 85, 60, 45, 30] }];

const listData = [
  { name: '手机', count: 120, percent: '35%' },
  { name: '电脑', count: 85, percent: '25%' },
  { name: '平板', count: 60, percent: '18%' },
  { name: '耳机', count: 45, percent: '13%' },
  { name: '配件', count: 30, percent: '9%' }
];

const listEl = document.getElementById('categoryList');
listEl.innerHTML = listData.map(item => `
  <div class="list-item">
    <div class="flex-1">
      <div class="title">${item.name}</div>
      <div class="caption">占比 ${item.percent}</div>
    </div>
    <div class="stat-num text-brand">${item.count}</div>
  </div>
`).join('');
</script>
</body>
</html>
