<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page p-0">
  <!-- 视觉锚点区：会员卡 -->
  <div class="hero-grad safe-top p-4 pb-6">
    <div class="eyebrow mb-1">MEMBER ANALYSIS</div>
    <div class="display mb-1">黄金会员</div>
    <div class="subtitle">权益使用度五维画像</div>
  </div>

  <!-- 数据图表区 -->
  <div class="card m-3 p-4">
    <div class="section-tt m-0 mb-4">权益使用趋势</div>
    
    <!-- 图例 -->
    <div class="f jcc g-4 mb-4">
      <div class="f aic g-1">
        <span class="w-2 h-2 r-f bg-brand"></span>
        <span class="caption text-muted">本月</span>
      </div>
      <div class="f aic g-1">
        <span class="w-2 h-2 r-f bg-gray-4"></span>
        <span class="caption text-muted">上月</span>
      </div>
    </div>

    <!-- 雷达图组件 -->
    <af-chart-radar id="radar" shape="circle" height="320"></af-chart-radar>
  </div>

  <!-- 详细数据列表 -->
  <div class="card m-3 mt-0 p-0">
    <div class="list">
      <div class="list-item">
        <div class="f aic jcsb w-full">
          <div class="f aic g-3">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-brand">
              <path d="M12 21s-7-5.1-7-11a7 7 0 0 1 14 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
            </svg>
            <span class="body">折扣优惠</span>
          </div>
          <div class="f aic g-2">
            <span class="caption text-muted">上月 50%</span>
            <span class="body text-brand">85%</span>
          </div>
        </div>
      </div>
      <div class="list-item">
        <div class="f aic jcsb w-full">
          <div class="f aic g-3">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-brand">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <span class="body">积分兑换</span>
          </div>
          <div class="f aic g-2">
            <span class="caption text-muted">上月 40%</span>
            <span class="body text-brand">60%</span>
          </div>
        </div>
      </div>
      <div class="list-item">
        <div class="f aic jcsb w-full">
          <div class="f aic g-3">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-brand">
              <rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            <span class="body">极速配送</span>
          </div>
          <div class="f aic g-2">
            <span class="caption text-muted">上月 60%</span>
            <span class="body text-brand">90%</span>
          </div>
        </div>
      </div>
      <div class="list-item">
        <div class="f aic jcsb w-full">
          <div class="f aic g-3">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-brand">
              <path d="M21 12a8 8 0 0 1-8 8H5l1.6-2.4A8 8 0 1 1 21 12z"/>
            </svg>
            <span class="body">专属客服</span>
          </div>
          <div class="f aic g-2">
            <span class="caption text-muted">上月 50%</span>
            <span class="body text-brand">75%</span>
          </div>
        </div>
      </div>
      <div class="list-item">
        <div class="f aic jcsb w-full">
          <div class="f aic g-3">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-brand">
              <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
            </svg>
            <span class="body">会员活动</span>
          </div>
          <div class="f aic g-2">
            <span class="caption text-muted">上月 55%</span>
            <span class="body text-brand">80%</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { registerChart } from '/af-mobile/charts/index.js';

// 注册图表组件
await registerChart('af-chart-radar');

const radar = document.getElementById('radar');

// 定义维度（五维权益）
radar.data = [
  { label: '折扣', max: 100 },
  { label: '积分', max: 100 },
  { label: '配送', max: 100 },
  { label: '客服', max: 100 },
  { label: '活动', max: 100 }
];

// 定义数据系列（本月 vs 上月）
radar.series = [
  { 
    name: '本月', 
    values: [85, 60, 90, 75, 80],
    color: 'var(--c-brand)' // 使用品牌色
  },
  { 
    name: '上月', 
    values: [50, 40, 60, 50, 55],
    color: 'var(--c-gray-4)' // 使用灰色
  }
];
</script>
</body>
</html>
