  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>云境咖啡 · af-mobile UI 全量范式页</title>
  <link rel="stylesheet" href="../src/index.css">
  <!-- 豁免：app-shell 兜底——.page 底部留出 fixed tabbar(≈s-8) + 安全区，框架未提供该变体 -->
  <style>
    .page { padding-bottom: calc(var(--s-4) + var(--s-8) + env(safe-area-inset-bottom)); }
    /* af-backtop 抬高到 fixed tabbar 之上（框架默认 bottom=s-4 落在 tabbar 区内会遮挡） */
    af-backtop { bottom: calc(var(--s-8) + var(--s-2) + env(safe-area-inset-bottom)); }
  </style>
  <!-- 主题防闪：先于组件挂载恢复 localStorage 主题 -->
  <script>try{var saved=localStorage.getItem('theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved}catch(e){}</script>
</head>
<body>
  <!-- app-shell：#app 为路由 outlet，af-tabbar 常驻 outlet 外（路由切换不销毁） -->
  <div id="app"></div>
  <af-tabbar id="tabbar" aria-label="主导航"></af-tabbar>

  <script type="module">
    import {
      register, escapeHtml as esc,
      initTheme, toggleTheme, getTheme,
      initLocale, addMessages, t, setLocale, getLocale,
      signal, computed, effect, batch, createRoot, createPage,
      fetchPage, registerBackend, addInterceptor, invalidateCache, createResource,
      route, go, start, afterEach, notFound,
    } from '../src/index.js';
    import { registerChart } from '../src/charts/index.js';

    /* ============ ① 按需注册（唯一合法方式，禁止全量注册 / UMD） ============ */

      'af-stepper', 'af-switch', 'af-field', 'af-swipe-cell', 'af-action-sheet',
      'af-steps', 'af-progress', 'af-rate', 'af-upload', 'af-toast', 'af-calendar');
    for (const c of ['af-chart-line', 'af-chart-bar', 'af-chart-pie', 'af-chart-radar', 'af-chart-funnel']) registerChart(c);

    initTheme();
    initLocale();

    /* ============ ② i18n：中英词条 + 即时切换 ============ */

      'menu.cup.M': '中杯 12oz', 'menu.cup.L': '大杯 16oz', 'menu.cup.XL': '超大杯 20oz',
      // 商品名（按 key 引用，PRODUCTS 存 nameKey）
      'prod.1': '云南日晒拿铁', 'prod.2': '哥伦比亚手冲', 'prod.3': '燕麦馥芮白', 'prod.4': '危地马拉冷萃',
      'prod.5': '茉莉初雪奶绿', 'prod.6': '鸭屎香柠檬茶', 'prod.7': '炙烤乌龙纯茶', 'prod.8': '桂花米乳茶',
      'prod.9': '可颂·海盐黄油', 'prod.10': '生巧熔岩挞', 'prod.11': '碱水结·原味', 'prod.12': '开心果巴斯克',

      'stats.day.5': '周五', 'stats.day.6': '周六', 'stats.day.7': '周日',
      'stats.cat.coffee': '咖啡', 'stats.cat.tea': '茶饮', 'stats.cat.bake': '烘焙',
      'stats.flavor.mellow': '醇厚', 'stats.flavor.acid': '果酸', 'stats.flavor.aroma': '香气',

      'stats.funnel.enter': '进店', 'stats.funnel.cart': '加购', 'stats.funnel.order': '下单',
      'stats.funnel.pay': '支付', 'stats.funnel.rebuy': '复购',
      'stats.series.latte': '奶咖', 'stats.series.pour': '手冲', 'stats.series.cups': '杯数',
      'stats.series.yunnan': '云南日晒', 'stats.series.geisha': '瑰夏',
      // region
      'region.yn': '云南省', 'region.km': '昆明市', 'region.wh': '五华区', 'region.pl': '盘龙区',
      'region.dl': '大理州', 'region.dls': '大理市',
      'region.sh': '上海市', 'region.ja': '静安区', 'region.xh': '徐汇区',
      'region.gd': '广东省', 'region.gz': '广州市', 'region.th': '天河区',
      // common
      'common.back': '返回', 'common.more': '更多', 'common.reorder': '再来一单',
      'common.confirm': '确认', 'common.cancel': '取消',
      // msg
      'msg.added': '已加入购物车', 'msg.done': '已完成', 'msg.needCart': '请先选购商品',
      'msg.pay.ok': '支付成功', 'msg.review.first': '请先打分',
      'msg.service': '客服小云已接入', 'msg.order.cancel': '订单已取消',
      'msg.upload.ignore': '已忽略 {n} 个不合规文件',
      // 404
      'nf.back': '返回首页',
    });
    addMessages('en-US', {
      // doc
      'doc.title': 'YunJing Coffee · af-mobile UI kitchen-sink', 'doc.aria': 'Main navigation',
      // tab
      'tab.menu': 'Menu', 'tab.cart': 'Cart', 'tab.orders': 'Orders', 'tab.stats': 'Stats',
      // menu
      'menu.search': 'Search coffee / tea', 'menu.flash': 'Yunnan batch 10% off, while stocks last',
      'menu.banner1.t': 'Yunnan Rainy Batch', 'menu.banner1.s': 'Sun-dried · 10% off',
      'menu.banner2.t': 'Pour-over Lab', 'menu.banner2.s': 'This week beans updated',
      'menu.banner3.t': 'Member Day', 'menu.banner3.s': 'Double points every Wed',
      'menu.discount': 'Limited-time offer',
      'menu.sort.rec': 'Recommended', 'menu.sort.price': 'Price first', 'menu.sort.sold': 'Top sold',
      'menu.cat.all': 'All', 'menu.cat.coffee': 'Coffee', 'menu.cat.tea': 'Tea', 'menu.cat.bake': 'Bakery',
      'menu.cup.M': 'Medium 12oz', 'menu.cup.L': 'Large 16oz', 'menu.cup.XL': 'X-Large 20oz',
      // prod
      'prod.1': 'Yunnan Sun-dried Latte', 'prod.2': 'Colombia Pour-over', 'prod.3': 'Oat Flat White', 'prod.4': 'Guatemala Cold Brew',
      'prod.5': 'Jasmine Snow Milk Tea', 'prod.6': 'Duck-Shit Lemon Tea', 'prod.7': 'Roasted Oolong', 'prod.8': 'Osmanthus Milk Tea',
      'prod.9': 'Croissant · Sea Salt', 'prod.10': 'Chocolate Lava Tart', 'prod.11': 'Pretzel · Original', 'prod.12': 'Pistachio Basque',
      // pd
      'pd.cup': 'Cup', 'pd.cream': 'Cream', 'pd.add': 'Add to cart', 'pd.qty': 'Qty',
      // cart
      'cart.title': 'Cart', 'cart.empty': 'Cart is empty', 'cart.goMenu': 'Browse menu',
      'cart.date': 'Pickup date', 'cart.addr': 'Address', 'cart.addrBtn': 'Choose region',
      'cart.note': 'Note', 'cart.notePh': 'Preferences, decaf… (optional)', 'cart.utensil': 'Utensils',
      'cart.clear': 'Clear', 'cart.checkout': 'Checkout', 'cart.pay': 'Total',
      'cart.confirm.body': 'Confirm submission? Production will start after submission.',
      'cart.confirm.ok': 'Confirm', 'cart.confirm.cancel': 'Cancel', 'cart.del': 'Delete',
      // orders
      'orders.title': 'Orders', 'orders.empty': 'No orders yet',
      'orders.pay': 'Pay now', 'orders.review': 'Submit review', 'orders.upload': 'Photos',
      'orders.tag.reviewed': 'Reviewed', 'orders.tag.waiting': 'Waiting', 'orders.tag.done': 'Done',
      'orders.items': '{n} items', 'orders.note': 'Note: {note}',
      'orders.sheet.service': 'Customer service', 'orders.sheet.cancel': 'Cancel order',
      'orders.step.0': 'Placed', 'orders.step.1': 'Preparing', 'orders.step.2': 'Ready', 'orders.step.3': 'Done',
      // stats
      'stats.title': 'Dashboard', 'stats.dark': 'Dark mode', 'stats.lang': '中文',
      'stats.kpi.cups': 'Cups today', 'stats.kpi.revenue': 'Revenue today', 'stats.kpi.avg': 'Avg order',
      'stats.target': 'Monthly target 68%',
      'stats.chart.line': 'Last 7 days', 'stats.chart.bar': 'Category sales', 'stats.chart.pie': 'Revenue mix',
      'stats.chart.radar': 'Signature bean flavor', 'stats.chart.funnel': 'Conversion funnel', 'stats.pref': 'Preferences',
      'stats.tip': 'Tap a point to view value',
      'stats.pie.center': 'Total {total}',
      'stats.select.line': '{label} · Series {series} · {value} cups',
      'stats.select.pie': '{label}: {value}',
      'stats.day.1': 'Mon', 'stats.day.2': 'Tue', 'stats.day.3': 'Wed', 'stats.day.4': 'Thu',
      'stats.day.5': 'Fri', 'stats.day.6': 'Sat', 'stats.day.7': 'Sun',
      'stats.cat.coffee': 'Coffee', 'stats.cat.tea': 'Tea', 'stats.cat.bake': 'Bakery',
      'stats.flavor.mellow': 'Mellow', 'stats.flavor.acid': 'Acidity', 'stats.flavor.aroma': 'Aroma',
      'stats.flavor.sweet': 'Aftertaste', 'stats.flavor.sugar': 'Sweetness',
      'stats.funnel.enter': 'Visit', 'stats.funnel.cart': 'Add to cart', 'stats.funnel.order': 'Order',
      'stats.funnel.pay': 'Pay', 'stats.funnel.rebuy': 'Rebuy',
      'stats.series.latte': 'Latte', 'stats.series.pour': 'Pour-over', 'stats.series.cups': 'Cups',
      'stats.series.yunnan': 'Yunnan Sun', 'stats.series.geisha': 'Geisha',
      // region
      'region.yn': 'Yunnan', 'region.km': 'Kunming', 'region.wh': 'Wuhua', 'region.pl': 'Panlong',
      'region.dl': 'Dali', 'region.dls': 'Dali City',
      'region.sh': 'Shanghai', 'region.ja': 'Jingan', 'region.xh': 'Xuhui',
      'region.gd': 'Guangdong', 'region.gz': 'Guangzhou', 'region.th': 'Tianhe',
      // common
      'common.back': 'Back', 'common.more': 'More', 'common.reorder': 'Reorder',
      'common.confirm': 'Confirm', 'common.cancel': 'Cancel',
      // msg
      'msg.added': 'Added to cart', 'msg.done': 'Done', 'msg.needCart': 'Cart is empty',
      'msg.pay.ok': 'Payment successful', 'msg.review.first': 'Please rate first',
      'msg.service': 'Agent Yun connected', 'msg.order.cancel': 'Order cancelled',
      'msg.upload.ignore': '{n} invalid file(s) skipped',
      // 404
      'nf.back': 'Back home',
    });

    /* ============ ③ mock 数据源：registerBackend 注册内存后端，零真实网络 ============ */
    // 商品插画：内联 SVG data URI，自包含无外部依赖（语言中性，无嵌入文字）
    const art = (hue) => 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},42%,72%)"/><stop offset="1" stop-color="hsl(${(hue + 40) % 360},38%,50%)"/></linearGradient></defs><rect width="480" height="320" fill="url(#g)"/></svg>`);
    const BROKEN = 'mock://broken.img';                      // 演示 af-img 加载失败 → failSrc 回退
    const FAIL = art(28);

    // 分类/商品名/区域/订单步骤：均以 key 存储，渲染时经 t() 翻译以响应 localechange
    const CATS = () => [['all', t('menu.cat.all')], ['coffee', t('menu.cat.coffee')], ['tea', t('menu.cat.tea')], ['bake', t('menu.cat.bake')]];
    const NAME_KEYS = [
      ['prod.1', 'coffee'], ['prod.2', 'coffee'], ['prod.3', 'coffee'], ['prod.4', 'coffee'],
      ['prod.5', 'tea'], ['prod.6', 'tea'], ['prod.7', 'tea'], ['prod.8', 'tea'],
      ['prod.9', 'bake'], ['prod.10', 'bake'], ['prod.11', 'bake'], ['prod.12', 'bake'],
    ];
    const PRODUCTS = Array.from({ length: 32 }, (_, i) => {
      const [nameKey, cat] = NAME_KEYS[i % NAME_KEYS.length];
      return { id: i + 1, nameKey, cat, price: 12 + (i % 9) * 3, rating: 4.2 + (i % 8) / 10,
        hot: i % 5 === 0, img: i === 9 ? BROKEN : art((i * 47) % 360) };
    });

    const REGION = () => [
      { label: t('region.yn'), value: 'yn', children: [
        { label: t('region.km'), value: 'km', children: [{ label: t('region.wh'), value: 'wh' }, { label: t('region.pl'), value: 'pl' }] },
        { label: t('region.dl'), value: 'dl', children: [{ label: t('region.dls'), value: 'dls' }] },
      ] },
      { label: t('region.sh'), value: 'sh', children: [
        { label: t('region.ja'), value: 'ja' }, { label: t('region.xh'), value: 'xh' },
      ] },
      { label: t('region.gd'), value: 'gd', children: [
        { label: t('region.gz'), value: 'gz', children: [{ label: t('region.th'), value: 'th' }] },
      ] },
    ];
    const STEPS = () => [t('orders.step.0'), t('orders.step.1'), t('orders.step.2'), t('orders.step.3')];

    // scheme 适配器：fetchPage 遇 mock:// URL 分发到此（真实项目替换为 supabase:// 等）
    registerBackend('mock', async (url, opts = {}) => {
      const u = new URL(url.slice(7) || '/', 'http://mock');               // 剥离 mock:// 便于解析 pathname + query
      const q = u.searchParams;
      if (u.pathname === '/products') {
        let list = PRODUCTS;
        const cat = q.get('cat'); const kw = (q.get('q') || '').trim().toLowerCase();
        if (cat && cat !== 'all') list = list.filter(p => p.cat === cat);
        if (kw) list = list.filter(p => t(p.nameKey).toLowerCase().includes(kw));  // 按 locale 翻译后匹配
        const sort = q.get('sort');
        if (sort === 'price') list = [...list].sort((a, b) => a.price - b.price);
        if (sort === 'sold') list = [...list].sort((a, b) => (b.id % 7) - (a.id % 7));
        const size = +(q.get('pageSize') || 8); const page = +(q.get('page') || 1);
        return { data: list.slice((page - 1) * size, page * size), total: list.length };
      }
      if (u.pathname === '/orders') return { data: orders(), total: orders().length };
      if (u.pathname === '/stats') return { data: {                       // 后端只返回 key + 数值，label 由前端 t() 翻译
        days: ['1', '2', '3', '4', '5', '6', '7'],
        latte: [120, 132, 101, 134, 90, 230, 210], pour: [32, 41, 38, 52, 46, 88, 76],
        cats: [{ key: 'coffee', value: 864 }, { key: 'tea', value: 512 }, { key: 'bake', value: 336 }],
        flavor: [{ key: 'mellow', value: 9, max: 10 }, { key: 'acid', value: 7, max: 10 }, { key: 'aroma', value: 8, max: 10 },
          { key: 'sweet', value: 6, max: 10 }, { key: 'sugar', value: 7, max: 10 }],
        funnel: [{ key: 'enter', value: 1200 }, { key: 'cart', value: 640 }, { key: 'order', value: 320 }, { key: 'pay', value: 268 }, { key: 'rebuy', value: 96 }],
      } };
      throw new Error('404: ' + u.pathname);
    });
    // 请求拦截器：模拟 250ms 网络延迟（loading / 骨架屏状态真实可演示）
    addInterceptor('request', (url, o) => new Promise(r => setTimeout(() => r(o), 250)));

    /* ============ ④ 全局状态：signal → computed → effect 单向数据流 ============ */
    const cart = signal([]);                                   // [{id,name,cup,price,qty,img}]
    const orders = signal([                                    // 初始两条订单，覆盖各状态
      { id: 'A2026081701', items: 2, total: 66, status: 3, progress: 100, payRemain: 0, reviewed: false },
      { id: 'A2026081702', items: 1, total: 28, status: 1, progress: 45, payRemain: 420, payDeadline: Date.now() + 420_000, reviewed: false },
    ]);
    const cartCount = computed(() => cart().reduce((n, it) => n + it.qty, 0));
    const cartTotal = computed(() => cart().reduce((n, it) => n + it.qty * it.price, 0));
    const yuan = n => '¥' + n.toFixed(2);

    // toast 单例：手动创建 .toast 元素是禁令，必须走组件实例管理
    const toast = document.createElement('af-toast');
    document.body.appendChild(toast);

    // tabbar：badge 由 cartCount 派生（computed + effect 自动联动），文案走 t()
    const tabbar = document.getElementById('tabbar');
    const TABS = () => [
      { label: t('tab.menu'), value: '/' },
      { label: t('tab.cart'), value: '/order' },
      { label: t('tab.orders'), value: '/orders' },
      { label: t('tab.stats'), value: '/stats' },
    ];
    effect(() => {
      const tabs = TABS();
      const n = cartCount();
      if (n) tabs[1].badge = n;                                // 购物车角标 = 商品种类数
      tabbar.tabs = tabs;
    });
    tabbar.addEventListener('af-tabbar:change', e => go(TABS()[e.detail.index].value));
    afterEach((r, p, path) => {                                // tabbar 高亮跟随路由（单一真相源）
      const idx = TABS().findIndex(x => x.value === path.split('?')[0]);
      if (idx >= 0) tabbar.activeIndex = idx;
    });
    // 语言切换：同步 title/lang/aria + 重建 tabbar 文案 + 重渲染当前视图
    const currentPath = () => location.hash.slice(1).split('?')[0] || '/';
    const syncDocLocale = () => {
      document.title = t('doc.title');
      document.documentElement.lang = getLocale() === 'en-US' ? 'en' : 'zh-CN';
      tabbar.setAttribute('aria-label', t('doc.aria'));
    };
    document.documentElement.addEventListener('localechange', () => {
      syncDocLocale();
      tabbar.tabs = TABS();
      const c = currentPath();
      if (c) go(c, { replace: true });
    });
    syncDocLocale();                                           // 初始化同步静态属性（tabbar.tabs 由下方 effect 驱动）

    const today = () => new Date().toISOString().slice(0, 10);
    let promoDeadline = 0;                                      // 限时折扣截止时刻（跨重渲染稳定，避免 countdown 重置）

    /* ============ ⑤ 视图 1：菜单（/）—— 浏览 / 搜索 / 加购 ============ */
    function menuPage(params, ctx) {
      if (!promoDeadline) promoDeadline = Date.now() + 1800_000;
      const promoRemain = Math.max(0, Math.round((promoDeadline - Date.now()) / 1000));
      ctx.outlet.innerHTML = `
        <main class="page fc g-3">
          <af-notice-bar text="${esc(t('menu.flash'))}" scroll></af-notice-bar>
          <af-search-bar placeholder="${esc(t('menu.search'))}" clearable debounce="200"></af-search-bar>
          <af-swiper autoplay="4000" loop>

      list.renderItem = (it, idx) => `

      async function load(reset) {
        if (reset) page = 1;
        const qs = new URLSearchParams({ ...query, page, pageSize: 8 });
        const { data, total } = await fetchPage('mock://products?' + qs);
        list.data = reset ? data : [...list.data, ...data];
        list.totalCount = total;
        if (list.data.length >= total) list.endLoadMore(false);
        sk.hidden = true;                                      // 首屏骨架 → 内容（原生 hidden，非 style）
      }
      list.addEventListener('af-list:loadmore', async e => { page = e.detail.page; await load(false); list.endLoadMore(true); });
      list.addEventListener('af-list:refresh', async () => {
        invalidateCache('mock://products');                    // 失效缓存后强制取新
        await load(true);
        list.endRefresh();
      });
      tabs.addEventListener('af-tabs:change', e => { query.cat = String(e.detail.value); load(true); });
      sort.addEventListener('af-dropdown:select', e => { query.sort = String(e.detail.value); load(true); });
      search.addEventListener('af-search-bar:input', e => { query.q = e.detail.value; load(true); });

      // 商品详情（af-dialog）：af-img 大图 + af-rate 只读 + af-picker 杯型 + af-stepper + af-switch
      const draft = { cup: 'L', qty: 1, cream: false, product: null };
      list.addEventListener('af-list:itemclick', e => {
        const p = e.detail.item;
        Object.assign(draft, { cup: 'L', qty: 1, cream: false, product: p });
        pd.title = t(p.nameKey);
        pd.querySelector('[slot="body"]').innerHTML = `

            <span class="label">${esc(t('pd.cup'))}</span>
            <button class="btn btn-ghost btn-sm" data-role="cup" type="button">${esc(t('menu.cup.' + draft.cup))}</button>
          </div>
          <div class="f aic jcsb">
            <span class="label">${esc(t('pd.qty'))}</span>
            <af-stepper value="1" min="1" max="9"></af-stepper>
          </div>
          <div class="f aic jcsb">
            <span class="label">${esc(t('pd.cream'))}</span>
            <af-switch></af-switch>
          </div>`;
        pd.open();                                             // 焦点陷阱由组件内实现，关闭自动还原
      });
      pd.addEventListener('click', e => {
        if (e.target.closest('[data-role="pd-cancel"]')) pd.close();
        if (e.target.closest('[data-role="cup"]')) picker.open();
      });
      picker.addEventListener('af-picker:confirm', e => {
        draft.cup = e.detail.values[0];
        const btn = pd.querySelector('[data-role="cup"]');
        if (btn) btn.textContent = t('menu.cup.' + draft.cup);
      });
      pd.addEventListener('af-stepper:change', e => { draft.qty = e.detail.value; });
      pd.addEventListener('af-switch:change', e => { draft.cream = e.detail.checked; });
      pd.addEventListener('click', e => {
        if (!e.target.closest('[data-role="pd-add"]')) return;
        const { product: p, cup, qty, cream } = draft;
        pd.close();
        batch(() => {                                          // batch：一次写多信号只通知一次
          const key = p.id + cup;
          const hit = cart().find(it => it.key === key);
          cart.set(hit
            ? cart().map(it => it.key === key ? { ...it, qty: Math.min(9, it.qty + qty) } : it)
            : [...cart(), { key, id: p.id, nameKey: p.nameKey, cup, qty, price: p.price + (cream ? 3 : 0), img: p.img }]);
        });
        toast.show(t('msg.added'), { type: 'success' });
      });

      load(true);
    }

      // 购物车行：af-swipe-cell 左滑删除 + af-stepper 改数量（事件委托挂常驻容器）
      const dispose = createRoot(() => {
        effect(() => {

          rows.innerHTML = items.length ? items.map(it => `
            <af-swipe-cell data-key="${esc(it.key)}">
              <div slot="content" class="list-item">

              <div slot="right"><button class="btn btn-sm btn-danger" data-act="del" type="button">${esc(t('cart.del'))}</button></div>
            </af-swipe-cell>`).join('')
            : `<div class="empty"><span class="body text-muted">${esc(t('cart.empty'))}</span>
               <button class="btn btn-ghost" data-role="goMenu" type="button">${esc(t('cart.goMenu'))}</button></div>`;
        });
        effect(() => { $('[data-role="total"]').textContent = yuan(cartTotal()); });
      });
      ctx.signal.addEventListener('abort', dispose);

      rows.addEventListener('af-stepper:change', e => {
        const key = e.target.closest('af-swipe-cell')?.dataset.key;
        cart.set(cart().map(it => it.key === key ? { ...it, qty: e.detail.value } : it));

      rows.addEventListener('af-swipe-cell:action', e => {

      $('[data-role="addr"]').addEventListener('click', () => cascade.open());
      cascade.addEventListener('af-picker:confirm', e => {
        // 逐级下钻 tree，把 value 链翻译为 label 链
        let level = REGION(); const labels = [];
        for (const v of e.detail.values) {
          const node = level.find(n => n.value === v);
          if (!node) break;
          labels.push(node.label);
          level = node.children || [];
        }
        if (labels.length) $('[data-role="addr"]').textContent = labels.join(' / ');
      });

      $('[data-role="clear"]').addEventListener('click', () => {
        if (!cart().length) return;
        cart.set([]);
        toast.show(t('msg.done'));
      });
      $('[data-role="checkout"]').addEventListener('click', () => {
        if (!cart().length) { toast.show(t('msg.needCart'), { type: 'warning' }); return; }

        toast.show(t('msg.done'), { type: 'success' });
        go('/orders');

    /* ============ ⑦ 视图 3：订单（/orders）—— 状态 / 进度 / 评价 ============ */
    function ordersPage(params, ctx) {
      ctx.outlet.innerHTML = `
        <main class="page fc g-3">
          <af-navbar title="${esc(t('orders.title'))}" show-back back-text="${esc(t('common.back'))}"></af-navbar>
          <af-pull-refresh data-role="pr">
            <div data-role="rows" class="fc g-3"></div>
          </af-pull-refresh>
          <af-action-sheet title="${esc(t('common.more'))}" show-cancel></af-action-sheet>
        </main>`;

      const $ = s => ctx.outlet.querySelector(s);
      const rows = $('[data-role="rows"]'), sheet = $('af-action-sheet');
      const review = {};                                       // 评价草稿：{ [oid]: { rate, files } }

      const dispose = createRoot(() => {
        effect(() => {
          const list = orders();
          rows.innerHTML = list.length ? list.map(o => {
            const body = o.status < 3 ? `
              <af-steps steps='${esc(JSON.stringify(STEPS()))}' current="${o.status}"></af-steps>
              <af-progress value="${o.progress}" max="100"></af-progress>` : '';
            const pay = o.payRemain > 0 && o.status === 1 ? `
              <div class="f aic jcsb">
                <af-countdown time="${Math.max(0, Math.round((o.payDeadline - Date.now()) / 1000))}" autostart></af-countdown>
                <button class="btn btn-sm" data-act="pay" type="button">${esc(t('orders.pay'))}</button>
              </div>` : '';
            const rateBox = o.status === 3 && !o.reviewed ? `
              <af-rate max="5" label="${esc(o.id)}"></af-rate>
              <af-upload accept="image/*" multiple max-size="2097152" max-count="3" button-text="${esc(t('orders.upload'))}"></af-upload>
              <button class="btn btn-sm btn-block" data-act="review" type="button">${esc(t('orders.review'))}</button>` : '';
            const tag = o.reviewed ? `<span class="tag tag-ok">${esc(t('orders.tag.reviewed'))}</span>`
              : o.status === 2 ? `<span class="tag tag-warn">${esc(t('orders.tag.waiting'))}</span>`
              : o.status === 3 ? `<span class="tag">${esc(t('orders.tag.done'))}</span>` : '';
            return `
              <div class="card fc g-3" data-oid="${esc(o.id)}">
                <div class="f aic jcsb">
                  <span class="caption text-muted">${esc(o.id)} · ${esc(t('orders.items', { n: o.items }))}</span>
                  ${tag}
                </div>
                ${o.note ? `<span class="caption text-muted">${esc(t('orders.note', { note: o.note }))}</span>` : ''}
                ${body}${pay}${rateBox}
                <div class="actions">
                  <button class="btn btn-ghost btn-sm" data-act="reorder" type="button">${esc(t('common.reorder'))}</button>
                  <button class="btn btn-ghost btn-sm" data-act="more" type="button">${esc(t('common.more'))}</button>
                </div>
              </div>`;
          }).join('') : `<div class="empty"><span class="body text-muted">${esc(t('orders.empty'))}</span></div>`;
        });
      });
      ctx.signal.addEventListener('abort', dispose);

      // 制作进度每 3s +4（signal 驱动重渲染；路由离开时经 abort 清理定时器）
      const timer = setInterval(() => {
        let changed = false;
        const next = orders().map(o => {
          if (o.status !== 1 || o.progress >= 100) return o;
          changed = true;
          const progress = Math.min(100, o.progress + 4);
          return { ...o, progress, status: progress >= 100 ? 2 : o.status };
        });
        if (changed) orders.set(next);
      }, 3000);
      ctx.signal.addEventListener('abort', () => clearInterval(timer));

      sheet.options = [
        { label: t('orders.sheet.service'), value: 'service' },
        { label: t('orders.sheet.cancel'), value: 'cancel', danger: true },
        { label: t('common.reorder'), value: 'reorder' },
      ];
      let sheetOid = null;
      // 再来一单：用下单时的购物车快照回填（数据单向：signal.set → effect 重渲染）
      function reOrder(oid) {
        const o = orders().find(x => x.id === oid);
        if (o?.snapshot?.length) { cart.set(o.snapshot); go('/order'); }
      }
      rows.addEventListener('click', e => {
        const oid = e.target.closest('[data-oid]')?.dataset.oid;
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (!oid || !act) return;
        if (act === 'more') { sheetOid = oid; sheet.showPopover(); }
        if (act === 'pay') { orders.set(orders().map(o => o.id === oid ? { ...o, payRemain: 0 } : o)); toast.show(t('msg.pay.ok'), { type: 'success' }); }
        if (act === 'reorder') reOrder(oid);
        if (act === 'review') {
          if (!review[oid]?.rate) { toast.show(t('msg.review.first'), { type: 'warning' }); return; }
          orders.set(orders().map(o => o.id === oid ? { ...o, reviewed: true } : o));
          toast.show(t('msg.done'), { type: 'success' });
        }
      });
      sheet.addEventListener('af-action-sheet:select', e => {
        if (e.detail.value === 'service') toast.show(t('msg.service'));
        if (e.detail.value === 'cancel') {
          orders.set(orders().filter(o => o.id !== sheetOid));
          toast.show(t('msg.order.cancel'));
        }
        if (e.detail.value === 'reorder') reOrder(sheetOid);
      });

      // 评价：评分 + 晒图（change 事件 detail.files 由组件生成预览）
      rows.addEventListener('af-rate:change', e => {
        const oid = e.target.closest('[data-oid]')?.dataset.oid;
        if (oid) review[oid] = { ...(review[oid] || {}), rate: e.detail.value };
      });
      rows.addEventListener('af-upload:change', e => {
        const oid = e.target.closest('[data-oid]')?.dataset.oid;
        if (oid) review[oid] = { ...(review[oid] || {}), files: e.detail.files?.length || 0 };
      });
      rows.addEventListener('af-upload:error', e => {
        toast.show(t('msg.upload.ignore', { n: e.detail.errors.length }), { type: 'warning' });
      });

      // 下拉刷新：重新拉取订单（走 mock 后端完整链路）
      $('[data-role="pr"]').addEventListener('af-pull-refresh:refresh', async () => {
        const { data } = await fetchPage('mock://orders');
        orders.set(data);
        $('[data-role="pr"]').endRefresh();
      });

      $('af-navbar').addEventListener('af-navbar:back', () => go('/'));
    }

    function statsPage(params, ctx) {

            <af-chart-radar legend lazy></af-chart-radar>
          </section>

            <span class="body t-b">${esc(t('stats.chart.funnel'))}</span>
            <af-chart-funnel show-rate lazy></af-chart-funnel>
          </section>
          <section class="card fc g-3">

        </main>`;

      const $ = s => ctx.outlet.querySelector(s);
      const sk = $('[data-role="sk"]');
      $('[data-role="theme"]').checked = getTheme() === 'dark';
      $('[data-role="lang"]').checked = getLocale() === 'en-US';
      $('[data-role="theme"]').addEventListener('af-switch:change', toggleTheme);
      $('[data-role="lang"]').addEventListener('af-switch:change', e => setLocale(e.detail.checked ? 'en-US' : 'zh-CN'));

      // ★ createPage 页面运行时工厂（src/lib/page.js，9 原语：state/computed/setup/effects/...）——库主推页面范式：
      //   setup 在 createRoot 内执行，其中 effect() 随 page.unmount() 级联销毁（无需手工 dispose）；
      //   page.mount(root) 接管 :bind 声明式绑定；unmount 挂到路由 ctx.signal，离开视图自动清理
      const page = createPage({
        setup() {
          // createResource：source → fetcher，loading/data/error 三态驱动骨架屏与图表；后端返回 key，前端按 locale 翻译
          const res = createResource(() => 'mock://stats', u => fetchPage(u));
          effect(() => {
            if (res.isLoading()) return;
            const d = res.data();
            if (!d) return;
            sk.hidden = true;
            const line = $('af-chart-line');
            line.labels = d.days.map(k => t('stats.day.' + k));
            line.series = [{ name: t('stats.series.latte'), values: d.latte }, { name: t('stats.series.pour'), values: d.pour }];
            const bar = $('af-chart-bar');
            bar.labels = d.cats.map(c => t('stats.cat.' + c.key));
            bar.series = [{ name: t('stats.series.cups'), values: d.cats.map(c => c.value) }];
            $('af-chart-pie').data = d.cats.map(c => ({ label: t('stats.cat.' + c.key), value: c.value }));
            const radar = $('af-chart-radar');
            radar.data = d.flavor.map(f => ({ label: t('stats.flavor.' + f.key), value: f.value, max: f.max }));
            radar.series = [{ name: t('stats.series.yunnan'), values: [9, 7, 8, 6, 7] }, { name: t('stats.series.geisha'), values: [6, 9, 9, 8, 5] }];
            $('af-chart-funnel').data = d.funnel.map(f => ({ label: t('stats.funnel.' + f.key), value: f.value }));
          });
          return { res };
        },
      });
      page.mount($('main'));
      ctx.signal.addEventListener('abort', () => page.unmount());

      $('af-chart-line').addEventListener('af-chart-line:select', e => {
        $('[data-role="tip"]').textContent = t('stats.select.line', { label: e.detail.label, series: e.detail.seriesIndex + 1, value: e.detail.value });
      });
      $('af-chart-pie').addEventListener('af-chart-pie:select', e => {
        toast.show(t('stats.select.pie', { label: e.detail.label, value: e.detail.value }));
      });
    }

    /* ============ ⑨ 路由装配 + 404 + 启动（hash 模式零服务端配置） ============ */
    route('/', menuPage);
    route('/order', cartPage);
    route('/orders', ordersPage);
    route('/stats', statsPage);
    notFound(path => {
      const app = document.getElementById('app');
      app.innerHTML = `
        <main class="page center g-3">
          <span class="display">404</span>
          <span class="body text-muted">${esc(path)}</span>
          <button class="btn" id="nf-back" type="button">${esc(t('nf.back'))}</button>
        </main>`;
      app.querySelector('#nf-back').addEventListener('click', () => go('/'));
    });
    start({ hash: true, outlet: '#app' });
  </script>
</body>
</html>
