<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/af-mobile.css">
</head>
<body>
<div class="page center p-4">
  <button id="trigger" class="btn btn-danger btn-block">删除记录</button>
</div>

<af-dialog id="d" title="删除确认">
  <div slot="body">
    <p class="body">确定要删除这条记录吗？删除后无法恢复。</p>
  </div>
  <div slot="footer">
    <button class="btn btn-ghost btn-block" data-act="cancel">取消</button>
    <button class="btn btn-block" data-act="confirm">确认删除</button>
  </div>
</af-dialog>

<script type="module">
const d = document.getElementById('d');
const trigger = document.getElementById('trigger');

trigger.addEventListener('click', () => d.open());

d.querySelector('[data-act="cancel"]').addEventListener('click', () => d.close());
d.querySelector('[data-act="confirm"]').addEventListener('click', () => d.close('confirm'));

d.addEventListener('af-dialog:close', (e) => {
  if (e.detail.action === 'confirm') {
    console.log('执行删除逻辑');
    // 实际业务代码
  }
});
</script>
</body>
</html>
